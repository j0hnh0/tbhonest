<script>

// ---------- Learn: latent TB visualizer ----------
(function(){

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  "3HP":{label:"3HP: isoniazid + rifapentine",weeks:12,months:"3 months",freq:"Once a week",doses:"12 doses",drugs:["inh","rif"],rifName:"rifapentine",weekly:true,pref:true},

}

const ALV=[]; { const cx=400,cy=290; const pts=[[0,0]]; for(let ring=1;ring<=3;ring++){ const n=ring*6; for(let k=0;k<n;k++){ const a=k/n*6.28+ring*0.3; pts.push([Math.cos(a)*ring*92,Math.sin(a)*ring*74]); } }
  for(const [dx,dy] of pts){ const x=cx+dx+(R()-.5)*14, y=cy+dy+(R()-.5)*12; if(x<40||x>760||y<120||y>500) continue; ALV.push({x,y,r:44+R()*14}); } }
const CAP=[]; for(let k=0;k<26;k++){ const a=ALV[Math.floor(R()*ALV.length)], b=ALV[Math.floor(R()*ALV.length)]; if(a===b||Math.hypot(a.x-b.x,a.y-b.y)>150) continue; CAP.push([a.x,a.y,(a.x+b.x)/2+(R()-.5)*40,(a.y+b.y)/2+(R()-.5)*40,b.x,b.y]); }

  (392,178,Math.PI*0.68,62,0); (function tree(x,y,a,len,d){ if(d>5) return; const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len; BR.push([x,y,x2,y2,Math.max(1,7-d*1.3)]); const s=0.38+R()*0.2; tree(x2,y2,a-s,len*0.72,d+1); tree(x2,y2,a+s,len*0.74,d+1); })(408,178,Math.PI*0.32,62,0);

const GL={

 tcell:["T cells (lymphocytes)","White blood cells that recognize a specific germ and direct the immune attack. They help build the granuloma and hold it together."],
 granuloma:["Granuloma","A tiny ball of immune cells that forms around germs the body can't kill, walling them off."],

 inh:["Isoniazid (H)","A TB antibiotic that stops germs from building their waxy outer wall. It works best on germs that are growing."],
 rif:["Rifamycins: rifampin (R) and rifapentine (P)","TB antibiotics that stop germs from making proteins. Rifapentine lasts longer in the body, so it's taken once a week."],

 tnf:["TNF blockers","Medicines for arthritis, Crohn's disease and similar conditions that calm part of the immune system. They raise the chance that latent TB wakes up."],

 code:["Treatment plan codes","The number is how many months the plan lasts. H = isoniazid, R = rifampin, P = rifapentine, Z = pyrazinamide, E = ethambutol, M = moxifloxacin. So 3HP is 3 months of isoniazid plus rifapentine, and 2HRZE/4HR is 2 months of HRZE, then 4 months of HR. In drug-resistant plans, B = bedaquiline, Pa (often written P) = pretomanid, L = linezolid."],
 reactivation:["Reactivation","When dormant TB germs wake up and start multiplying again, turning latent TB into active TB disease. It can happen soon after infection or many years later."],
 divide:["Dividing","TB germs multiply by splitting in two. They're slow: one germ takes about a day to divide, so TB disease builds up over weeks to months."],
 liquefy:["Liquefy","When the solid, cheese-like core of a granuloma turns soft and runny. TB germs grow very well in this liquid."],
 cavity:["Cavity","A hole left in the lung when the softened core of a granuloma drains out through an airway. Cavities hold huge numbers of germs, which makes the person very contagious."],
 spread:["TB outside the lungs","TB germs can travel in the blood or lymph to the lymph nodes, kidneys, spine, brain, bones and joints. Doctors call this extrapulmonary TB."],
 pulm:["Pulmonary TB (TB in the lungs)","The most common kind of TB disease. It can cause a cough that lasts 3 weeks or longer, chest pain, and coughing up blood or sputum (phlegm from deep in the lungs). This is the kind that spreads to other people."],
 meningitis:["TB meningitis","TB of the lining around the brain and spinal cord. It can cause headache or confusion and needs medical care right away."],
 larynx:["Voice box (larynx)","TB of the voice box can cause hoarseness. Like TB in the lungs, it can spread to other people."],
 lymph:["Lymph nodes","Small, bean-shaped immune glands in the neck, armpits and elsewhere. TB there can cause a firm red or purple swelling under the skin."],
 pleura:["Pleura (lining of the lungs)","The thin lining around the lungs. TB there can cause chest pain and fluid buildup around the lung, which makes it harder to breathe."],
 kidney:["Kidney TB","TB germs that settle in the kidneys can cause blood in the urine."],
 spine:["Spinal TB","TB of the spine can cause back pain. Without treatment it can damage the bones of the spine."],
 bone:["TB of the bones and joints","TB can settle in bones and joints, causing pain and swelling that can look like arthritis."],
 miliary:["Miliary TB","TB that spreads through the blood to many organs at once, leaving tiny spots the size of millet seeds. It's fatal if untreated."],
 sweats:["Night sweats","Heavy sweating during sleep that can soak clothes or sheets. A common sign of active TB disease, along with fever and weight loss."],
 pza:["Pyrazinamide (Z)","A TB antibiotic that works best in the acidic places where germs hide, like inside macrophages and the inflamed core. Used in the first 2 months."],
 emb:["Ethambutol (E)","A TB antibiotic that blocks germs from building their cell wall. It's used in the first 2 months to help guard against drug resistance."],
 mox:["Moxifloxacin (M)","An antibiotic that stops TB germs from copying their DNA. It's part of the newer 4-month plan."],
 dot:["Directly observed therapy (DOT)","A health worker watches each dose being taken, in person or by video. It's the standard of care for TB disease and helps people finish treatment."],
 persister:["Persisters","A small share of TB germs that are slow-growing or dormant. Medicines kill them slowly, which is why treatment lasts months even after a person feels better."],
 intensive:["Intensive phase","The first 2 months of treatment for TB disease, using 4 drugs at once to kill most germs quickly and keep resistance from developing."],
 continuation:["Continuation phase","The last months of treatment, using fewer drugs to kill the slow, dormant germs that remain. It prevents relapse."],
 relapse:["Relapse","When TB disease comes back after treatment, usually because surviving germs started multiplying again."],
 resistant:["Drug-resistant TB","TB germs that a medicine can no longer kill. It's harder, longer and more costly to treat. Taking every dose is the best way to prevent it."],
 bdq:["Bedaquiline (B)","A TB drug that shuts down ATP synthase, the motor that makes the germ's energy. It works on both growing and resting germs."],
 pa:["Pretomanid (Pa)","A TB drug that blocks the waxy coat in growing germs and releases nitric oxide, a poison gas, inside resting ones."],
 lzd:["Linezolid (L)","An antibiotic that jams the ribosome so the germ can't make proteins. It can cause nerve damage and low blood counts, so it's closely monitored."],
 gyrase:["DNA gyrase","An enzyme that untwists DNA so it can be copied. Moxifloxacin jams it, and the germ's DNA breaks."],
 ribosome:["Ribosome","The cell's protein factory. It reads RNA messages and strings together proteins."],
 atp:["ATP synthase","A tiny spinning motor in the germ's membrane that makes ATP, the energy every cell runs on."],
 arab:["Arabinogalactan","A sugar layer in the TB cell wall that anchors the waxy outer coat. Ethambutol blocks it from being built."],
 rr:["Rifampin-resistant TB","TB that rifampin can no longer kill. It is often also resistant to isoniazid (called MDR TB) and needs different drugs."],
 fq:["Fluoroquinolones","A family of antibiotics that includes moxifloxacin. They attack DNA gyrase."],

        if(b.style==="burst"){ ctx.save(); ctx.globalAlpha*=1-age; const off=age*9; rod(ctx,x+Math.cos(b.rot)*off,y+Math.sin(b.rot)*off,b.rot+age,len*0.5,5,P.dead); rod(ctx,x-Math.cos(b.rot)*off,y-Math.sin(b.rot)*off,b.rot-age,len*0.5,5,P.dead); ctx.restore(); }
        else { ctx.save(); ctx.globalAlpha*=(1-age)*0.8; rod(ctx,x,y,b.rot,len*(1-age*0.5),5*(1-age*0.4),P.dead); ctx.restore(); }
        continue; } }
    const jx=Math.sin(T*1.3+b.ph)*wig, jy=Math.cos(T*1.1+b.ph)*wig;
    ctx.save(); ctx.globalAlpha*=al; rod(ctx,x+jx,y+jy,b.rot+Math.sin(T*0.5+b.ph)*0.08*wig,len,5.2,col); ctx.restore(); }
  // flowing out to airway
  if(p>0.65){ const a=sm((p-0.65)/0.3); for(let i=0;i<10;i++){ const t=((T*0.3+i/10)%1); const x=470+(800-470)*t, y=190-170*Math.pow(t,0.9)+Math.sin(i+T)*6; ctx.save(); ctx.globalAlpha*=a*(1-t); rod(ctx,x,y,-0.6,12,5,P.bug); ctx.restore(); } }
  // drug particles
  const dt=1/60; for(const q of S.parts){ q.life+=dt; const dx=CX-q.x, dy=CY-q.y, d=Math.hypot(dx,dy)||1; q.vx+=dx/d*10*dt+(Math.random()-.5)*30*dt; q.vy+=dy/d*10*dt+(Math.random()-.5)*30*dt; if(d<40){q.vx*=0.96;q.vy*=0.96;} q.x+=q.vx*dt; q.y+=q.vy*dt;
    const al=Math.min(1,q.life*3)*(1-q.life/q.max); if(al<=0) continue; ctx.save(); ctx.globalAlpha*=al*0.9; ctx.fillStyle=q.d==="inh"?P.inh:P.rif;
    if(q.d==="inh"){ ctx.beginPath(); ctx.arc(q.x,q.y,3.4,0,6.28); ctx.fill(); } else { ctx.beginPath(); ctx.moveTo(q.x,q.y-4.4); ctx.lineTo(q.x+4.4,q.y); ctx.lineTo(q.x,q.y+4.4); ctx.lineTo(q.x-4.4,q.y); ctx.closePath(); ctx.fill(); } ctx.restore(); }
  S.parts=S.parts.filter(q=>q.life<q.max);
  // labels
  if(mode!=="active"){ label(ctx,P,CX-20,CY+20,250,470,"Cheese-like core of dead tissue","right"); label(ctx,P,MAC[6].x,MAC[6].y,668,236,"Macrophages"); label(ctx,P,LYM[3].x,LYM[3].y,630,150,"T cells\n(lymphocytes)"); label(ctx,P,CX-150,CY-150,140,128,"Fibrous wall","right");
    const gi=MAC.findIndex(m=>m.giant); if(gi>=0) label(ctx,P,MAC[gi].x,MAC[gi].y,MAC[gi].x>CX?650:150,MAC[gi].y>CY?400:96,"Giant cell (fused\nmacrophages)",MAC[gi].x>CX?"left":"right"); }
  if(mode==="treat"&&S.t>0) label(ctx,P,693,400,785,330,"Medicine arrives\nthrough the blood","right");
  if(mode==="active"&&S.t>0.8){ const a=sm((S.t-0.8)/0.08); for(const v of VES){ for(let i=0;i<6;i++){ const t=((T*0.16+i/6)%1), [x,y]=bz(v,v===VES[1]?1-t:t); ctx.save(); ctx.globalAlpha*=a*Math.sin(t*Math.PI); rod(ctx,x,y,T+i,10,4.5,P.bug); ctx.restore(); } } }
  if(mode==="active"){ const st=stageOf(S.t);
    if(st===0) label(ctx,P,LYM[3].x,LYM[3].y,630,150,"T cells thin out as the\nimmune system weakens");
    else if(st===1) label(ctx,P,CX+30,CY-20,560,96,"Dormant germs wake up\nand start dividing","left");
    else if(st===2) label(ctx,P,CX+130,CY+50,545,470,"Macrophages are overwhelmed;\nthe core starts to liquefy","left");
    else if(st===3) label(ctx,P,600,110,590,40,"The core breaks into an airway,\nleaving a cavity","right");
    else label(ctx,P,696,386,560,476,"Germs travel in the blood\nto other organs","right"); }
  if(stopped&&counts()>0) label(ctx,P,BAC.find(b=>b.k>cut)?.x||CX,BAC.find(b=>b.k>cut)?.y||CY,640,470,"Survivors can\nwake up later");
}
window.APTB={mount:host=>mount(host),resume:()=>resume()};
})();

</script>
