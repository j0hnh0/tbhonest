              <Search size={18} style={{ color: "var(--ink-soft)" }} />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder={strings.searchPlaceholder}
                className={`bg-transparent outline-none w-full ${bodySize}`}
                style={{ color: "var(--ink)" }}
              />
              {query && (
                <button onClick={() => setQuery("")} aria-label="Clear search">
                  <X size={16} style={{ color: "var(--ink-soft)" }} />
                </button>
              )}
            </div>

            <div className="flex gap-2 overflow-x-auto pb-1 mb-6" style={{ scrollbarWidth: "none" }}>
              {CATEGORIES.map((c) => {
                const activeCat = c === category;
                return (
                  <button
                    key={c}
                    onClick={() => setCategory(c)}
                    className={`shrink-0 rounded-full px-4 py-1.5 border font-semibold ${bodySize}`}
                    style={{
                      borderColor: activeCat ? "var(--highlight)" : "var(--line)",
                      backgroundColor: activeCat ? "var(--accent-soft)" : "transparent",
                      color: activeCat ? "var(--ink)" : "var(--ink-soft)",
                    }}
                  >
                    {localizedCategory(c)}
                  </button>
                );
              })}
            </div>

            {filtered.length === 0 ? (
              <p className={`${bodySize} py-8`} style={{ color: "var(--ink-soft)" }}>
                {strings.noResults}
              </p>
            ) : (
              <div>
                {filtered.map((a, i) => {
                  const loc = localizedArticle(a);
                  const snippet = matchSnippet(a, query.trim().toLowerCase());
                  return (
                    <button
                      key={a.id}
                      onClick={() => openArticle(a.id)}
                      className="w-full text-left py-5"
                      style={{ borderTop: i === 0 ? "1px solid var(--line)" : "none", borderBottom: "1px solid var(--line)" }}
                    >
                      <div className={listTitleSize} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
                        {loc.title}
                      </div>
                      <div className={`${bodySize} mt-1`} style={{ color: "var(--ink-soft)" }}>
                        {loc.summary}
                      </div>
                      {snippet && (
                        <div className="text-sm mt-1.5 italic" style={{ color: "var(--ink-soft)" }}>
                          "{snippet}"
                        </div>
                      )}
                      <div className="text-sm mt-2" style={{ color: "var(--highlight)" }}>
                        {localizedCategory(a.category)} · {a.readTime}
                      </div>
                    </button>
                  );
                })}
              </div>
            )}

            <p className="text-sm mt-8" style={{ color: "var(--ink-soft)" }}>
              {strings.libraryDisclaimer}
            </p>
          </>
        )}

        {/* ---------------- latest research ---------------- */}
        {view === "home" && tab === "research" && (
          <>
            <p className={`${introSize} leading-snug mb-2`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 500 }}>
              Real TB research, explained simply.
            </p>
            <p className={`${bodySize} mb-1`} style={{ color: "var(--ink-soft)" }}>
              We periodically review current studies, guidelines, and health news about TB, then rewrite what
              we find in plain language. Every item links back to its real source.
            </p>
            <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
              Last updated: {RESEARCH_LAST_UPDATED}
            </p>

            <div>
              {RESEARCH_ITEMS.map((r, i) => {
                const expanded = expandedResearchId === r.id;
                return (
                  <div key={r.id || i} style={{ borderTop: i === 0 ? "1px solid var(--line)" : "none", borderBottom: "1px solid var(--line)" }}>
                    <div
                      role="button"
                      tabIndex={0}
                      onClick={() => setExpandedResearchId(expanded ? null : r.id)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" || e.key === " ") {
                          e.preventDefault();
                          setExpandedResearchId(expanded ? null : r.id);
                        }
                      }}
                      aria-expanded={expanded}
                      className="w-full text-left py-5 cursor-pointer"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div className={listTitleSize} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
                          {r.headline}
                        </div>
                        <ChevronDown
                          size={20}
                          style={{ color: "var(--ink-soft)", transform: expanded ? "rotate(180deg)" : "none", flexShrink: 0, marginTop: 4 }}
                        />
                      </div>
                      <div className={`${bodySize} mt-1`} style={{ color: "var(--ink-soft)" }}>
                        {renderRichText(r.whyItMatters || "", bodySize)}
                      </div>
                      <div className="text-sm mt-2" style={{ color: "var(--highlight)" }}>
                        {r.tag ? `${r.tag} · ` : ""}
                        {r.source}
                        {r.datePublished ? ` · ${r.datePublished}` : ""}
                      </div>
                    </div>

                    {expanded && (
                      <div className="pb-5">
                        <div className={`${bodySize} space-y-3`} style={{ lineHeight: 1.7 }}>
                          {researchSummaryFor(r).map((p, idx) => (
                            <p key={idx}>{renderRichText(p, bodySize)}</p>
                          ))}
                        </div>
                        {r.sourceUrl && (
                          <a
                            href={r.sourceUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className={`inline-flex items-center gap-1.5 mt-3 font-semibold ${bodySize}`}
                            style={{ color: "var(--accent)" }}
                          >
                            Read the source
                            <ExternalLink size={15} />
                          </a>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <p className="text-sm mt-8" style={{ color: "var(--ink-soft)" }}>
              These summaries are written by AI from current research and news, and may contain mistakes. Use
              the source link to check the original, and always talk with your doctor or nurse about your own
              health.
            </p>
          </>
        )}

        {/* ---------------- LTBI guide ---------------- */}
        {view === "home" && tab === "journey" && (
          <>
            <p className={`${introSize} leading-snug mb-2`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 500 }}>
              Your LTBI Guide
            </p>
            <p className={`${bodySize} mb-1`} style={{ color: "var(--ink-soft)" }}>
              A step-by-step walkthrough for latent TB diagnosis and treatment. Tap the stage that matches where
              you are right now.
            </p>
            <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
              This guide is currently available in English only.
            </p>

            {/* horizontal timeline */}
            <div className="overflow-x-auto pb-2 mb-6" style={{ scrollbarWidth: "thin" }}>
              <div className="flex" style={{ minWidth: JOURNEY_STAGES.length * 92 }}>
                {JOURNEY_STAGES.map((stage, i) => {
                  const isActive = activeJourneyStage === stage.id;
                  const isPast = JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage) > i;
                  return (
                    <div key={stage.id} className="flex flex-col items-center" style={{ width: 92, flexShrink: 0 }}>
                      <div className="flex items-center w-full">
                        <div
                          className="flex-1"
                          style={{ height: 2, backgroundColor: i === 0 ? "transparent" : isPast || isActive ? "var(--highlight)" : "var(--line)" }}
                        />
                        <button
                          onClick={() => {
                            setActiveJourneyStage(stage.id);
                          }}
                          aria-current={isActive}
                          className="rounded-full flex items-center justify-center font-bold shrink-0"
                          style={{
                            width: 36,
                            height: 36,
                            fontSize: "0.9rem",
                            border: isActive ? "none" : "2px solid var(--line)",
                            backgroundColor: isActive ? "var(--accent)" : isPast ? "var(--accent-soft)" : "var(--bg)",
                            color: isActive ? "white" : "var(--ink)",
                          }}
                        >
                          {i + 1}
                        </button>
                        <div
                          className="flex-1"
                          style={{ height: 2, backgroundColor: i === JOURNEY_STAGES.length - 1 ? "transparent" : isPast ? "var(--highlight)" : "var(--line)" }}
                        />
                      </div>
                      <button
                        onClick={() => setActiveJourneyStage(stage.id)}
                        className="text-center mt-2 text-xs leading-tight px-1"
                        style={{ color: isActive ? "var(--ink)" : "var(--ink-soft)", fontWeight: isActive ? 700 : 400 }}
                      >
                        {stage.shortLabel}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* content panel for the selected stage */}
            {(() => {
              const stage = JOURNEY_STAGES.find((s) => s.id === activeJourneyStage);
              if (!stage) return null;
              return (
                <div className="pb-2" style={{ borderTop: "1px solid var(--line)", paddingTop: 20 }}>
                  <div className={listTitleSize} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
                    {stage.label}
                  </div>
                  <div className={`${bodySize} mt-1 mb-4`} style={{ color: "var(--ink-soft)" }}>
                    {stage.teaser}
                  </div>

                  {stage.subOptions ? (
                    <>
                      <div className="flex flex-wrap gap-2 mb-4">
                        {stage.subOptions.map((opt) => {
                          const selected = journeySubSelections[stage.id] === opt.id;
                          return (
                            <button
                              key={opt.id}
                              onClick={() => setJourneySubSelections((prev) => ({ ...prev, [stage.id]: opt.id }))}
                              className={`rounded-full px-4 py-1.5 border font-semibold ${bodySize}`}
                              style={{
                                borderColor: selected ? "var(--highlight)" : "var(--line)",
                                backgroundColor: selected ? "var(--accent-soft)" : "transparent",
                                color: selected ? "var(--ink)" : "var(--ink-soft)",
                              }}
                            >
                              {opt.shortLabel || opt.label}
                            </button>
                          );
                        })}
                      </div>
                      {!journeySubSelections[stage.id] && (
                        <p className={`${bodySize}`} style={{ color: "var(--ink-soft)" }}>
                          {stage.id === "your-medicine"
                            ? "Tap the regimen your provider prescribed to see how to take it."
                            : "Tap the result you got to see what it means."}
                        </p>
                      )}
                      {journeySubSelections[stage.id] &&
                        (() => {
                          const opt = stage.subOptions.find((o) => o.id === journeySubSelections[stage.id]);
                          if (!opt) return null;
                          return (
                            <div className={`${bodySize} space-y-3`} style={{ lineHeight: 1.7 }}>
                              <div className="font-semibold" style={{ fontFamily: HEADLINE_FONT_STACK }}>
                                {opt.label}
                              </div>
                              {opt.body.map((p, idx) => (
                                <p key={idx}>{renderRichText(p, bodySize)}</p>
                              ))}
                            </div>
                          );
                        })()}
                    </>
                  ) : (
                    <div className={`${bodySize} space-y-3`} style={{ lineHeight: 1.7 }}>
                      {stage.body.map((p, idx) => (
                        <p key={idx}>{renderRichText(p, bodySize)}</p>
                      ))}
                    </div>
                  )}

                  <div className="flex items-center justify-between mt-6 pt-4" style={{ borderTop: "1px solid var(--line)" }}>
                    <button
                      onClick={() => {
                        const idx = JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage);
                        if (idx > 0) setActiveJourneyStage(JOURNEY_STAGES[idx - 1].id);
                      }}
                      disabled={JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage) === 0}
                      className={`flex items-center gap-1 font-semibold ${bodySize}`}
                      style={{ color: "var(--accent)", opacity: JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage) === 0 ? 0.3 : 1 }}
                    >
                      <ChevronLeft size={18} />
                      Back
                    </button>
                    <button
                      onClick={() => {
                        const idx = JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage);
                        if (idx < JOURNEY_STAGES.length - 1) setActiveJourneyStage(JOURNEY_STAGES[idx + 1].id);
                      }}
                      disabled={JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage) === JOURNEY_STAGES.length - 1}
                      className={`flex items-center gap-1 font-semibold ${bodySize}`}
                      style={{
                        color: "var(--accent)",
                        opacity: JOURNEY_STAGES.findIndex((s) => s.id === activeJourneyStage) === JOURNEY_STAGES.length - 1 ? 0.3 : 1,
                      }}
                    >
                      Next
                      <ChevronDown size={18} style={{ transform: "rotate(-90deg)" }} />
                    </button>
                  </div>
                </div>
              );
            })()}

            <p className="text-sm mt-8" style={{ color: "var(--ink-soft)" }}>
              This guide is general educational information, not personal medical advice, and it doesn't
              replace instructions from your own provider or pharmacist. If anything here conflicts with what
              they've told you, follow their instructions.
            </p>
          </>
        )}

        {/* ---------------- article ---------------- */}
        {view === "article" && activeArticle && (
          <div>
            <div className="text-sm font-semibold mb-2" style={{ color: "var(--highlight)" }}>
              {localizedCategory(activeArticle.category)} · {activeArticle.readTime}
            </div>
            <h1 className={`${titleSize} mb-4 leading-tight`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
              {localizedArticle(activeArticle).title}
            </h1>

            <div className="inline-flex rounded-full p-1 mb-6" style={{ backgroundColor: "var(--bg-alt)" }} role="tablist" aria-label="Reading level">
              {[
                ["simple", strings.simple],
                ["detailed", strings.moreDetail],
              ].map(([key, label]) => (
                <button
                  key={key}
                  role="tab"
                  aria-selected={level === key}
                  onClick={() => setLevel(key)}
                  className={`rounded-full px-4 py-1.5 font-semibold ${bodySize}`}
                  style={{ backgroundColor: level === key ? "var(--accent)" : "transparent", color: level === key ? "white" : "var(--ink-soft)" }}
                >
                  {label}
                </button>
              ))}
            </div>

            {(() => {
              const body = localizedBody(activeArticle);
              return (
                <>
                  {body.isFallbackEnglish && (
                    <p className="text-sm mb-4 italic" style={{ color: "var(--ink-soft)" }}>
                      {strings.detailFallback}
                    </p>
                  )}
                  <div className={`${bodySize} space-y-4`} style={{ lineHeight: 1.7 }}>
                    {body.paragraphs.map((p, idx) => (
                      <p key={idx}>{renderRichText(p, bodySize)}</p>
                    ))}
                  </div>
                </>
              );
            })()}

            {activeArticle.sources && activeArticle.sources.length > 0 && (
              <div className="mt-10 pt-6" style={{ borderTop: "1px solid var(--line)" }}>
                <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink-soft)" }}>
                  {strings.sources}
                </div>
                <ul className="space-y-1">
                  {activeArticle.sources.map((s, idx) => (
                    <li key={idx}>
                      <a
                        href={s.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-sm inline-flex items-center gap-1"
                        style={{ color: "var(--accent)" }}
                      >
                        {s.label}
                        <ExternalLink size={12} />
                      </a>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <p className="text-sm mt-6 pt-6" style={{ color: "var(--ink-soft)", borderTop: activeArticle.sources ? "none" : "1px solid var(--line)" }}>
              {strings.articleDisclaimer}
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TBHonestResearchApp />);

</script>
<script>
  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]]
  }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = compiled;
  document.body.appendChild(scriptEl);
</script>
</body>
</html>
