  testing: {

        "Xét nghiệm da cần một lần khám lại sau 2–3 ngày để kiểm tra cánh tay. Xét nghiệm máu chỉ cần một lần khám.",

    ru: { title: "Прохождение теста на туберкулёз", summary: "Два основных теста и что означают их результаты.",

  "bcg-vaccine": {
    es: { title: "Vacunas de TB y resultados confusos", summary: "Por qué una vacuna de la infancia puede hacer que una prueba cutánea salga positiva años después.",
      simple: [
        "Existe una vacuna contra la TB llamada BCG. Se aplica a bebés y niños pequeños en muchos países donde la TB es común, pero no es una vacuna de rutina en Estados Unidos.",
        "La BCG protege principalmente a los niños pequeños de las formas más graves de TB, pero es menos confiable para prevenir la TB pulmonar en adultos.",

    "zh-Hans": { title: "结核疫苗与令人困惑的检测结果", summary: "为什么儿时接种的疫苗会让多年后的皮肤测试呈阳性。",

    "zh-Hant": { title: "結核疫苗與令人困惑的檢測結果", summary: "為什麼兒時接種的疫苗會讓多年後的皮膚測試呈陽性。",
      simple: [
        "有一種結核疫苗叫卡介苗（BCG）。許多結核病常見的國家會為嬰兒和幼兒接種，但美國並不常規接種此疫苗。",
        "卡介苗主要保護幼兒免於最嚴重的結核病，但對預防成人肺結核的效果並不穩定可靠。",
        "由於卡介苗是由結核細菌的減毒近親製成，可能使多年後的皮膚測試呈陽性，即使並未真正感染，這稱為偽陽性。",
        "若您小時候接種過卡介苗，皮膚測試呈陽性，可要求改做血液測試，因為卡介苗不會影響血液測試結果。陽性結果並不代表您患有活動性結核病——請與醫生討論下一步。",
      ] },
    vi: { title: "Vắc-xin Lao và Kết Quả Xét Nghiệm Gây Nhầm Lẫn", summary: "Tại sao một mũi tiêm thời thơ ấu có thể khiến xét nghiệm da dương tính nhiều năm sau.",
      simple: [
        "Có một loại vắc-xin lao gọi là BCG. Vắc-xin này được tiêm cho trẻ sơ sinh và trẻ nhỏ ở nhiều quốc gia có bệnh lao phổ biến, nhưng không phải là vắc-xin thường quy ở Hoa Kỳ.",
        "BCG chủ yếu bảo vệ trẻ nhỏ khỏi các dạng lao nghiêm trọng nhất, nhưng kém tin cậy hơn trong việc ngăn ngừa lao phổi ở người lớn.",
        "Vì BCG được làm từ một chủng vi khuẩn yếu, có họ hàng với vi khuẩn lao, nó có thể khiến xét nghiệm da dương tính nhiều năm sau, ngay cả khi không thực sự bị nhiễm lao. Đây gọi là dương tính giả.",
        "Nếu bạn đã tiêm BCG khi còn nhỏ và xét nghiệm da cho kết quả dương tính, hãy hỏi về xét nghiệm máu, vì BCG không ảnh hưởng đến kết quả đó. Kết quả dương tính không có nghĩa là bạn mắc lao hoạt động — hãy trao đổi với bác sĩ về các bước tiếp theo.",
      ] },
    ko: { title: "결핵 백신과 헷갈리는 검사 결과", summary: "어릴 때 맞은 백신이 왜 몇 년 후 피부 검사를 양성으로 만들 수 있는지.",
      simple: [
        "BCG라는 결핵 백신이 있습니다. 결핵이 흔한 많은 나라에서 영유아에게 접종하지만, 미국에서는 정기 접종 백신이 아닙니다.",
        "BCG는 주로 어린이를 가장 심각한 형태의 결핵으로부터 보호하지만, 성인의 폐결핵을 예방하는 데는 효과가 일정하지 않습니다.",
        "BCG는 결핵균과 비슷한 약화된 균으로 만들어졌기 때문에, 실제 감염이 없어도 몇 년 후 피부 검사에서 양성 반응을 일으킬 수 있습니다. 이를 위양성이라고 합니다.",
        "어릴 때 BCG를 맞았고 피부 검사가 양성으로 나왔다면, 혈액 검사를 요청해보세요. BCG는 혈액 검사 결과에 영향을 주지 않습니다. 양성 결과가 활동성 결핵을 의미하는 것은 아니니 의사와 다음 단계를 상의하세요.",
      ] },
    tl: { title: "Bakuna sa TB at Nakakalitong Resulta ng Pagsusuri", summary: "Bakit ang bakuna noong bata ka pa ay maaaring magpapositibo sa skin test pagkalipas ng maraming taon.",
      simple: [
        "May bakuna para sa TB na tinatawag na BCG. Ibinibigay ito sa mga sanggol at maliliit na bata sa maraming bansang karaniwan ang TB, pero hindi ito regular na bakuna sa Estados Unidos.",
        "Pangunahing pinoprotektahan ng BCG ang mga maliliit na bata mula sa pinakamalalang uri ng TB, pero hindi ito palaging maaasahan sa pagpigil ng TB sa baga ng mga matatanda.",
        "Dahil ang BCG ay gawa sa pinahinang kamag-anak ng bakterya ng TB, maaari nitong mapapositibo ang skin test pagkalipas ng maraming taon, kahit walang tunay na impeksyon. Tinatawag itong maling positibo.",
        "Kung nabakunahan ka ng BCG noong bata ka at pumositibo ang iyong skin test, magtanong tungkol sa blood test, dahil hindi ito naaapektuhan ng BCG. Ang positibong resulta ay hindi nangangahulugang may active TB ka — kausapin ang iyong doktor tungkol sa susunod na hakbang.",
      ] },
    ru: { title: "Вакцины от туберкулёза и запутанные результаты теста", summary: "Почему прививка в детстве может дать положительный результат кожной пробы спустя годы.",
      simple: [
        "Существует вакцина от туберкулёза под названием БЦЖ. Её делают младенцам и маленьким детям во многих странах, где туберкулёз распространён, но в США она не входит в обычный график прививок.",
        "БЦЖ в основном защищает маленьких детей от самых тяжёлых форм туберкулёза, но менее надёжно предотвращает лёгочный туберкулёз у взрослых.",
        "Поскольку БЦЖ сделана из ослабленного родственника бактерии туберкулёза, она может вызвать положительный результат кожной пробы спустя годы, даже без настоящей инфекции. Это называется ложноположительный результат.",
        "Если вам делали БЦЖ в детстве и кожная проба положительна, попросите анализ крови — на него БЦЖ не влияет. Положительный результат не означает, что у вас активный туберкулёз — обсудите с врачом дальнейшие шаги.",
      ] },
  },
  "immigration-status": {
    es: { title: "La TB, la TB latente y tu estatus migratorio", summary: "Lo que realmente afecta un caso de inmigración, y lo que no.",
      simple: [
        "Si te preocupa que una prueba de TB pueda perjudicar una solicitud de inmigración, este es el dato más importante: solo la TB activa y contagiosa (lo que las autoridades migratorias llaman 'TB Clase A') puede hacer que alguien sea inadmisible a Estados Unidos. La TB latente no descalifica a nadie en un examen médico migratorio.",
        "Si un examen médico migratorio encuentra TB latente, normalmente se te clasificará como alguien que necesita seguimiento médico, no se te rechazará. El tratamiento se recomienda, no se usa en tu contra.",
        "Las clínicas de salud pública para la TB existen para controlar la propagación de la enfermedad, no para hacer cumplir las leyes de inmigración. La información médica está protegida por leyes de privacidad. Si tienes dudas sobre una clínica en particular, es razonable llamar y preguntar antes de tu visita.",
        "El 'cargo público' es una regla aparte, sobre ciertos beneficios del gobierno, y sus detalles han cambiado varias veces en los últimos años y siguen siendo debatidos en los tribunales y en nuevas regulaciones. Como esto sigue cambiando, la información general puede quedar desactualizada rápido — una organización de ayuda legal migratoria gratuita o de bajo costo puede darte una respuesta basada en la regla actual y tu situación específica.",
        "Hacerte la prueba y, si es necesario, tratarte la TB es algo que los expertos en salud pública quieren para todos, sin importar el estatus migratorio. La TB activa sin tratar es un riesgo mucho mayor para tu salud que cualquier preocupación de papeleo.",
      ] },
    "zh-Hans": { title: "结核病、潜伏结核与您的移民身份", summary: "真正会影响移民案件的因素，以及不会影响的因素。",
      simple: [
        "如果您担心结核病检测会影响移民申请，最重要的事实是：只有活动性、具传染性的结核病（移民部门称为“A类结核”）才会使申请人被认定为“不可入境”。潜伏结核不会使任何人在移民体检中不合格。",
        "如果移民体检发现潜伏结核，通常会被归类为需要后续医疗随访，而不会被拒绝。医生会建议接受治疗，而不会因此对您不利。",
        "结核病公共卫生诊所的职责是控制疾病传播，而不是执行移民法律。医疗信息受隐私法保护。如果您对某诊所的做法有疑问，可以在就诊前致电询问。",
        "“公共负担”是另一项关于特定政府福利的规定，其细节近年多次变化，目前仍在法院和新法规中被讨论。由于这项规定仍在变化中，笼统的信息可能很快过时——免费或低成本的移民法律援助机构可以根据当前规定和您的具体情况给出答案。",
        "无论移民身份如何，接受检测并在需要时接受治疗，都是公共卫生专家希望每个人都做到的事。未经治疗的活动性结核病对您健康的威胁，远大于任何文件方面的顾虑。",
      ] },
    "zh-Hant": { title: "結核病、潛伏結核與您的移民身分", summary: "真正會影響移民案件的因素，以及不會影響的因素。",
      simple: [
        "如果您擔心結核病檢測會影響移民申請，最重要的事實是：只有活動性、具傳染性的結核病（移民部門稱為「A類結核」）才會使申請人被認定為「不可入境」。潛伏結核不會使任何人在移民體檢中不合格。",
        "如果移民體檢發現潛伏結核，通常會被歸類為需要後續醫療追蹤，而不會被拒絕。醫生會建議接受治療，而不會因此對您不利。",
        "結核病公共衛生診所的職責是控制疾病傳播，而不是執行移民法律。醫療資訊受隱私法保護。若您對某診所的做法有疑問，可在就診前致電詢問。",
        "「公共負擔」是另一項關於特定政府福利的規定，其細節近年多次變化，目前仍在法院和新法規中被討論。由於這項規定仍在變動中，籠統的資訊可能很快過時——免費或低成本的移民法律援助機構可以根據目前的規定和您的具體情況給您解答。",
        "無論移民身分為何，接受檢測並在需要時接受治療，都是公共衛生專家希望每個人都做到的事。未經治療的活動性結核病對您健康的威脅，遠大於任何文件方面的顧慮。",
      ] },
    vi: { title: "Bệnh Lao, Lao Tiềm Ẩn, và Tình Trạng Di Trú của Bạn", summary: "Điều thực sự ảnh hưởng đến hồ sơ di trú — và điều không ảnh hưởng.",
      simple: [
        "Nếu bạn lo lắng xét nghiệm lao có thể ảnh hưởng đến hồ sơ di trú, đây là sự thật quan trọng nhất: chỉ có lao hoạt động, có khả năng lây nhiễm (mà cơ quan di trú gọi là 'Lao Loại A') mới có thể khiến ai đó không đủ điều kiện nhập cảnh Hoa Kỳ. Lao tiềm ẩn không loại ai khỏi việc khám sức khỏe di trú.",
        "Nếu khám sức khỏe di trú phát hiện lao tiềm ẩn, bạn thường sẽ được xếp vào diện cần theo dõi y tế thêm, chứ không bị từ chối. Việc điều trị được khuyến nghị, không phải điều bất lợi cho bạn.",
        "Các phòng khám lao công cộng tồn tại để kiểm soát sự lây lan của bệnh, không phải để thực thi luật di trú. Thông tin y tế được bảo vệ bởi luật riêng tư. Nếu không chắc chắn, bạn có thể gọi hỏi chính sách của phòng khám trước khi đến khám.",
        "'Gánh nặng công cộng' là một quy định riêng, liên quan đến một số phúc lợi của chính phủ, và các chi tiết của nó đã thay đổi nhiều lần trong những năm gần đây và vẫn đang được tranh luận tại tòa án và trong các quy định mới. Vì điều này vẫn đang thay đổi, thông tin chung có thể nhanh chóng lỗi thời — một tổ chức hỗ trợ pháp lý di trú miễn phí hoặc chi phí thấp có thể cho bạn câu trả lời dựa trên quy định hiện hành và tình huống cụ thể của bạn.",
        "Việc xét nghiệm và, nếu cần, điều trị bệnh lao là điều mà các chuyên gia y tế công cộng mong muốn cho tất cả mọi người, bất kể tình trạng di trú. Lao hoạt động không được điều trị là rủi ro lớn hơn nhiều cho sức khỏe của bạn so với bất kỳ lo lắng nào về giấy tờ.",
      ] },
    ko: { title: "결핵, 잠복결핵, 그리고 이민 신분", summary: "실제로 이민 사건에 영향을 주는 것과 그렇지 않은 것.",
      simple: [
        "결핵 검사가 이민 신청에 해가 될까 봐 걱정된다면, 가장 중요한 사실은 이것입니다: 활동성이고 전염성이 있는 결핵('클래스 A 결핵'이라 불림)만이 미국 입국 부적격 사유가 될 수 있습니다. 잠복결핵은 이민 건강검진에서 누구도 자격을 박탈하지 않습니다.",
        "이민 건강검진에서 잠복결핵이 발견되면 보통 추가 진료가 필요한 것으로 분류될 뿐, 거부되지 않습니다. 치료는 권장 사항이지 불이익이 아닙니다.",
        "결핵 관련 공중보건 클리닉은 질병 확산을 막기 위해 존재하는 것이지, 이민법을 집행하기 위한 것이 아닙니다. 의료 정보는 개인정보 보호법으로 보호됩니다. 확실하지 않다면 방문 전에 클리닉에 정책을 직접 문의하는 것도 좋은 방법입니다.",
        "'공공부담(Public Charge)'은 특정 정부 혜택에 관한 별개의 규정으로, 최근 몇 년간 여러 차례 바뀌었고 지금도 법원과 새로운 규정에서 계속 논의되고 있습니다. 계속 변하고 있는 사안이기 때문에, 일반적인 정보는 금방 낡은 정보가 될 수 있습니다 — 무료 또는 저비용 이민 법률 지원 기관이 현재 규정과 본인 상황에 맞는 답을 줄 수 있습니다.",
        "이민 신분과 관계없이 검사를 받고 필요하면 치료를 받는 것은 공중보건 전문가들이 모두에게 바라는 일입니다. 치료하지 않은 활동성 결핵은 서류상의 어떤 걱정보다 건강에 훨씬 더 큰 위험입니다.",
      ] },
    tl: { title: "TB, Latent TB, at ang Iyong Immigration Status", summary: "Ang talagang nakakaapekto sa isang kaso ng imigrasyon — at ang hindi.",
      simple: [
        "Kung nag-aalala kang makakasama sa imigrasyon ang isang pagsusuri sa TB, ito ang pinakamahalagang katotohanan: tanging ang aktibo at nakakahawang TB lamang (tinatawag na 'Class A TB' ng mga awtoridad sa imigrasyon) ang maaaring maging dahilan upang ituring na 'inadmissible' ang isang tao sa Estados Unidos. Hindi dinidiskwalipika ng latent TB ang sinuman sa medical exam para sa imigrasyon.",
        "Kung sa medical exam para sa imigrasyon ay natuklasang may latent TB ang isang tao, karaniwan siyang ituturing na kailangan lang ng follow-up na pangangalaga, hindi tatanggihan. Iniirerekomenda ang paggamot, hindi ito laban sa iyo.",
        "Ang mga klinika ng pampublikong kalusugan para sa TB ay nariyan upang kontrolin ang paglaganap ng sakit, hindi para ipatupad ang batas sa imigrasyon. Protektado ang impormasyong medikal ng mga batas sa privacy. Kung hindi ka sigurado, makatuwiran na tumawag at magtanong sa isang klinika bago ang iyong pagbisita.",
        "Ang 'public charge' ay hiwalay na patakaran tungkol sa ilang benepisyo ng gobyerno, at nagbago na ito nang ilang beses sa mga nakaraang taon at pinagtatalunan pa rin sa mga korte at bagong regulasyon. Dahil patuloy itong nagbabago, maaaring maging luma agad ang pangkalahatang impormasyon — makakatulong ang isang libre o murang organisasyon ng legal na tulong sa imigrasyon na magbigay ng sagot batay sa kasalukuyang patakaran at sa iyong sitwasyon.",
        "Ang pagpapasuri at, kung kinakailangan, ang paggamot sa TB ay bagay na gustong makamit ng mga eksperto sa pampublikong kalusugan para sa lahat, anuman ang immigration status. Ang hindi ginagamot na active TB ay mas malaking panganib sa iyong kalusugan kaysa sa anumang alalahanin sa papeles.",
      ] },
    ru: { title: "Туберкулёз, латентный туберкулёз и ваш иммиграционный статус", summary: "Что действительно влияет на иммиграционное дело — а что нет.",
      simple: [
        "Если вы переживаете, что тест на туберкулёз может навредить иммиграционному заявлению, вот самый важный факт: только активный, заразный туберкулёз (то, что иммиграционные органы называют «туберкулёз класса А») может сделать человека не имеющим права на въезд в США. Латентный туберкулёз не лишает никого права пройти иммиграционный медицинский осмотр.",
        "Если при иммиграционном медосмотре обнаружен латентный туберкулёз, обычно это означает, что нужно дальнейшее наблюдение, а не отказ. Лечение рекомендуется, а не используется против вас.",
        "Клиники общественного здравоохранения по туберкулёзу существуют для борьбы с распространением болезни, а не для соблюдения иммиграционных законов. Медицинская информация защищена законами о конфиденциальности. Если вы не уверены, разумно позвонить в клинику и спросить о её политике перед визитом.",
        "«Общественная нагрузка» (public charge) — это отдельное правило о некоторых государственных льготах, и его детали неоднократно менялись за последние годы и всё ещё обсуждаются в судах и новых нормативных актах. Поскольку это правило продолжает меняться, общая информация может быстро устареть — бесплатная или недорогая организация иммиграционной юридической помощи может дать ответ на основе действующих правил и вашей ситуации.",
        "Пройти тест и, при необходимости, лечение от туберкулёза — это то, чего специалисты по общественному здравоохранению хотят для всех, независимо от иммиграционного статуса. Нелеченый активный туберкулёз представляет гораздо больший риск для вашего здоровья, чем любые опасения по поводу документов.",
      ] },
  },
  "employment-rights": {
    es: { title: "El tratamiento de la TB latente y tu trabajo", summary: "Lo que tienes (y no tienes) que decirle a tu empleador, y qué protege la ley.",
      simple: [
        "La TB latente no es contagiosa, así que en la mayoría de los trabajos no hay obligación legal de decírselo a tu empleador, ni razón para dejar de trabajar o cambiar tus funciones.",
        "Si sí compartes información médica con tu empleador, por ejemplo para pedir tiempo libre para citas médicas, la ley de EE. UU. (la ADA) exige que esa información se mantenga confidencial y separada de tu archivo de personal regular.",
        "Algunos trabajos, especialmente en salud, cuidado infantil, educación y correccionales, tienen sus propias reglas de detección de TB establecidas por ley estatal o local. Son distintas de las protecciones laborales generales y varían según el estado.",
        "Los empleadores no pueden legalmente negarse a contratar, despedir o excluir del trabajo a alguien solo por tener TB latente y no ser contagioso. Esto de hecho ha sido sancionado por reguladores federales.",
        "Si crees que has recibido un trato injusto en el trabajo por un diagnóstico de TB, la Comisión de Igualdad de Oportunidades en el Empleo de EE. UU. (EEOC) y muchas organizaciones locales de derechos laborales ofrecen ayuda gratuita.",
      ] },
    "zh-Hans": { title: "潜伏结核治疗与您的工作", summary: "您需要（和不需要）告诉雇主的事情，以及法律保护哪些内容。",
      simple: [
        "潜伏结核不具传染性，因此在大多数工作中，法律并不要求您告知雇主，也没有理由需要停止工作或改变工作内容。",
        "如果您确实需要与雇主分享医疗信息，例如为了请假去看病，美国法律（《美国残疾人法》，ADA）要求这些信息必须保密，并与您的普通人事档案分开存放。",
        "有些工作，尤其是医疗保健、儿童看护、教育和惩教工作，有其州或地方法律规定的结核病筛查要求，这与一般的职场保护规定不同，各州差异也很大。",
        "雇主不得仅因为员工患有不具传染性的潜伏结核，就合法拒绝雇用、解雇或将其排除在工作之外。这一点实际上已被联邦监管机构强制执行过。",
        "如果您认为自己因结核病诊断而在工作中受到不公平对待，美国平等就业机会委员会（EEOC）以及许多地方的劳工权益组织都提供免费帮助。",
      ] },
    "zh-Hant": { title: "潛伏結核治療與您的工作", summary: "您需要（和不需要）告訴雇主的事情，以及法律保護哪些內容。",
      simple: [
        "潛伏結核不具傳染性，因此在大多數工作中，法律並不要求您告知雇主，也沒有理由需要停止工作或改變工作內容。",
        "如果您確實需要與雇主分享醫療資訊，例如為了請假去看病，美國法律（《美國身心障礙者法》，ADA）要求這些資訊必須保密，並與您的一般人事檔案分開存放。",
        "有些工作，尤其是醫療保健、兒童照護、教育和矯正工作，有其州或地方法律規定的結核病篩檢要求，這與一般職場保護規定不同，各州差異也很大。",
        "雇主不得僅因員工患有不具傳染性的潛伏結核，就合法拒絕雇用、解僱或將其排除在工作之外。這一點實際上已被聯邦監管機構強制執行過。",
        "如果您認為自己因結核病診斷而在工作中受到不公平對待，美國平等就業機會委員會（EEOC）以及許多地方的勞工權益組織都提供免費協助。",
      ] },
    vi: { title: "Điều Trị Lao Tiềm Ẩn và Công Việc của Bạn", summary: "Những gì bạn phải (và không phải) nói với chủ lao động, và luật bảo vệ gì.",
      simple: [
        "Lao tiềm ẩn không lây nhiễm, vì vậy ở hầu hết các công việc, không có yêu cầu pháp lý nào buộc bạn phải cho chủ lao động biết, và cũng không có lý do gì để ngừng làm việc hay thay đổi nhiệm vụ.",
        "Nếu bạn có chia sẻ thông tin y tế với chủ lao động, chẳng hạn để xin nghỉ đi khám, luật Hoa Kỳ (ADA) yêu cầu thông tin đó phải được giữ bí mật và lưu trữ riêng khỏi hồ sơ nhân sự thông thường của bạn.",
        "Một số công việc, đặc biệt là y tế, chăm sóc trẻ em, giáo dục, và cải huấn, có các quy định riêng về xét nghiệm lao do luật tiểu bang hoặc địa phương quy định. Đây là quy định khác với các bảo vệ chung tại nơi làm việc, và khác nhau tùy theo từng bang.",
        "Chủ lao động không được phép hợp pháp từ chối tuyển dụng, sa thải, hoặc loại một người khỏi công việc chỉ vì họ mắc lao tiềm ẩn và không lây nhiễm. Điều này thực tế đã từng bị các cơ quan liên bang xử phạt.",
        "Nếu bạn cho rằng mình đã bị đối xử bất công tại nơi làm việc vì chẩn đoán lao, Ủy ban Cơ hội Việc làm Bình đẳng Hoa Kỳ (EEOC) và nhiều tổ chức quyền lợi người lao động địa phương cung cấp hỗ trợ miễn phí.",
      ] },
    ko: { title: "잠복결핵 치료와 당신의 직장", summary: "고용주에게 알려야 할 것(그리고 알리지 않아도 되는 것), 그리고 법이 보호하는 것.",
      simple: [
        "잠복결핵은 전염성이 없기 때문에, 대부분의 직장에서는 고용주에게 알릴 법적 의무가 없으며, 일을 그만두거나 업무를 바꿔야 할 이유도 없습니다.",
        "진료 예약을 위한 휴가 신청 등으로 고용주와 의료 정보를 공유해야 한다면, 미국 법(장애인법, ADA)에 따라 그 정보는 기밀로 유지되어야 하며 일반 인사 파일과 별도로 보관되어야 합니다.",
        "특히 의료, 보육, 교육, 교정 시설 등 일부 직종은 주 또는 지역 법률에 따라 자체적인 결핵 검사 규정을 두고 있습니다. 이는 일반적인 직장 내 보호와는 별개이며 주마다 차이가 있습니다.",
        "고용주는 전염성이 없는 잠복결핵을 가진 직원을 그 이유만으로 고용을 거부하거나 해고하거나 업무에서 배제할 수 없습니다. 실제로 연방 규제 기관이 이를 집행한 사례가 있습니다.",
        "결핵 진단으로 인해 직장에서 부당한 대우를 받았다고 생각된다면, 미국 평등고용기회위원회(EEOC)와 여러 지역 노동자 권리 단체가 무료로 도움을 제공합니다.",
      ] },
    tl: { title: "Paggamot sa Latent TB at ang Iyong Trabaho", summary: "Ang dapat (at hindi kailangang) sabihin mo sa iyong employer, at kung ano ang pinoprotektahan ng batas.",
      simple: [
        "Hindi nakakahawa ang latent TB, kaya sa karamihan ng trabaho, walang legal na obligasyon na sabihin ito sa iyong employer, at walang dahilan para huminto sa trabaho o baguhin ang iyong mga tungkulin.",
        "Kung magbahagi ka man ng impormasyong medikal sa iyong employer, halimbawa para humingi ng bakasyon para sa appointment, iniaatas ng batas ng U.S. (ang ADA) na panatilihing kompidensyal ang impormasyong iyon at itago nang hiwalay sa iyong regular na personnel file.",
        "May ilang trabaho, lalo na sa healthcare, pangangalaga sa bata, edukasyon, at mga institusyong pangkorreksyon, na may sariling mga patakaran sa pagsusuri ng TB na itinatakda ng batas ng estado o lokal na pamahalaan. Iba ito sa pangkalahatang proteksyon sa trabaho at nag-iiba depende sa estado.",
        "Hindi legal na maaaring tumangging kumuha, magtanggal, o hindi payagang magtrabaho ang isang employer sa isang tao dahil lamang sa mayroon itong latent TB at hindi nakakahawa. Ito ay talagang ipinatupad na ng mga pederal na regulator.",
        "Kung sa palagay mo ay hindi ka makatarungang tinrato sa trabaho dahil sa diagnosis ng TB, ang U.S. Equal Employment Opportunity Commission (EEOC) at maraming lokal na organisasyon ng karapatan ng manggagawa ay nag-aalok ng libreng tulong.",
      ] },
    ru: { title: "Лечение латентного туберкулёза и ваша работа", summary: "Что вы должны (и не должны) сообщать работодателю, и что защищает закон.",
      simple: [
        "Латентный туберкулёз не заразен, поэтому на большинстве работ нет юридической обязанности сообщать об этом работодателю, и нет причин прекращать работу или менять обязанности.",
        "Если вы всё же делитесь медицинской информацией с работодателем, например, чтобы отпроситься на приём к врачу, законодательство США (ADA) требует, чтобы эта информация оставалась конфиденциальной и хранилась отдельно от обычного личного дела.",
        "Некоторые профессии, особенно в здравоохранении, уходе за детьми, образовании и исправительных учреждениях, имеют собственные правила проверки на туберкулёз, установленные законами штата или местными властями. Это отдельно от общих трудовых прав и различается в зависимости от штата.",
        "Работодатели не имеют законного права отказывать в приёме на работу, увольнять или отстранять человека только потому, что у него латентный туберкулёз и он не заразен. Это реально применялось федеральными регуляторами.",
        "Если вы считаете, что столкнулись с несправедливым отношением на работе из-за диагноза туберкулёза, Комиссия по соблюдению равноправия при трудоустройстве США (EEOC) и многие местные организации по защите прав работников предлагают бесплатную помощь.",
      ] },
  },
  "treating-latent": {
    es: { title: "Tratamiento de la infección latente de TB", summary: "Los tratamientos cortos ahora hacen más fácil terminarlos.",
      simple: [
        "Tratar la TB latente reduce mucho la probabilidad de que se convierta en TB activa más adelante.",
        "Ahora los médicos suelen recomendar tratamientos más cortos, de tres a cuatro meses, con uno o dos medicamentos, en lugar de los tratamientos antiguos de seis a nueve meses con una sola pastilla diaria.",
        "Todas estas opciones funcionan bien, y los tratamientos más cortos son más fáciles de terminar.",
        "Lo más importante es tomar cada dosis y completar todo el tratamiento, aunque te sientas completamente bien todo el tiempo.",
      ] },
    "zh-Hans": { title: "潜伏结核感染的治疗", summary: "如今的短疗程让完成治疗变得更容易。",
      simple: [
        "治疗潜伏结核可以大幅降低日后发展为活动性结核的可能性。",
        "现在医生通常推荐使用一到两种药物、为期三到四个月的短疗程，而不是过去六到九个月每天服一种药的疗程。",
        "这些方案的效果都很好，而且短疗程通常更容易坚持完成。",
        "最重要的是按时服用每一剂药物并完成整个疗程，即使您全程感觉良好。",
      ] },
    "zh-Hant": { title: "潛伏結核感染的治療", summary: "如今的短療程讓完成治療變得更容易。",
      simple: [
        "治療潛伏結核可以大幅降低日後發展為活動性結核的可能性。",
        "現在醫生通常建議使用一到兩種藥物、為期三到四個月的短療程，而非過去六到九個月每天服用一種藥物的療程。",
        "這些方案的效果都很好，而且短療程通常更容易堅持完成。",
        "最重要的是按時服用每一劑藥物並完成整個療程，即使您全程感覺良好。",
      ] },
    vi: { title: "Điều Trị Nhiễm Lao Tiềm Ẩn", summary: "Các liệu trình ngắn hơn hiện nay giúp việc hoàn thành điều trị dễ dàng hơn.",
      simple: [
        "Điều trị lao tiềm ẩn giúp giảm đáng kể khả năng nó chuyển thành lao hoạt động sau này.",
        "Hiện nay các bác sĩ thường đề nghị liệu trình ngắn hơn, kéo dài ba đến bốn tháng, dùng một hoặc hai loại thuốc, thay vì liệu trình cũ kéo dài sáu đến chín tháng với một loại thuốc uống hàng ngày.",
        "Tất cả các lựa chọn này đều hiệu quả, và liệu trình ngắn hơn thường dễ hoàn thành hơn.",
        "Điều quan trọng nhất là uống đủ mọi liều thuốc và hoàn thành toàn bộ liệu trình, ngay cả khi bạn cảm thấy hoàn toàn khỏe mạnh suốt thời gian đó.",
      ] },
    ko: { title: "잠복결핵감염 치료", summary: "이제는 짧은 치료 기간 덕분에 치료를 끝까지 마치기가 더 쉬워졌습니다.",
      simple: [
        "잠복결핵을 치료하면 나중에 활동성 결핵으로 진행될 가능성이 크게 줄어듭니다.",
        "요즘 의사들은 한두 가지 약으로 3~4개월간 진행하는 더 짧은 치료를 권장하는 경우가 많습니다. 예전에는 하루 한 알씩 6~9개월간 복용해야 했습니다.",
        "이 모든 방법은 효과가 좋으며, 짧은 치료일수록 끝까지 마치기가 더 쉽습니다.",
        "가장 중요한 것은 몸이 계속 멀쩡하게 느껴지더라도 모든 용량을 빠짐없이 복용하고 전체 치료 과정을 끝내는 것입니다.",
      ] },
    tl: { title: "Paggamot sa Latent TB Infection", summary: "Mas madali na ngayong tapusin ang paggamot dahil sa mas maiikling regimen.",
      simple: [
        "Ang paggamot sa latent TB ay lubos na binabawasan ang tsansang ito ay maging active TB sa hinaharap.",
        "Kadalasan ay iniirerekomenda na ngayon ng mga doktor ang mas maikling paggamot na tatlo hanggang apat na buwan, gamit ang isa o dalawang gamot, sa halip na ang lumang paggamot na anim hanggang siyam na buwan ng isang tabletas araw-araw.",
        "Epektibo ang lahat ng mga opsyong ito, at mas madaling tapusin ang mas maiikling paggamot.",
        "Ang pinakamahalaga ay inumin ang bawat dosis at tapusin ang buong paggamot, kahit na pakiramdam mo ay maayos ka sa buong panahong ito.",
      ] },
    ru: { title: "Лечение латентной туберкулёзной инфекции", summary: "Короткие курсы теперь облегчают завершение лечения.",
      simple: [
        "Лечение латентного туберкулёза значительно снижает вероятность того, что он перейдёт в активную форму в будущем.",
        "Сейчас врачи чаще рекомендуют более короткие курсы — три-четыре месяца с одним или двумя препаратами — вместо старых курсов по шесть-девять месяцев с одной таблеткой в день.",
        "Все эти варианты эффективны, а короткие курсы легче довести до конца.",
        "Самое важное — принимать каждую дозу и завершить полный курс, даже если вы чувствуете себя совершенно здоровым всё это время.",
      ] },
  },
  "ltbi-regimens": {
    es: { title: "Comparación de los tratamientos para LTBI", summary: "Nombres de los medicamentos, cuántas pastillas, efectos secundarios, y qué tan bien los completa la gente.",
      simple: [
        "Los tratamientos para la LTBI usan tres medicamentos principales: isoniazida, rifapentina y rifampina. Todos funcionan bien; las diferencias están en la duración, el número de pastillas y los efectos secundarios.",
        "La rifampina sola, a diario durante 4 meses, es una opción corta y sencilla: normalmente 2 pastillas al día. Los efectos secundarios comunes incluyen dolor de cabeza leve, molestias estomacales durante una hora después de tomarla, y líquidos corporales de color naranja, sobre todo la orina.",
        "Isoniazida más rifapentina, una vez por semana durante 12 semanas, significa menos dosis totales, pero más pastillas por dosis (a veces 7 a 9 pastillas de una vez). Algunas personas sienten síntomas parecidos a la gripe después de una dosis.",
        "La isoniazida sola, de 6 a 9 meses, es la opción más antigua, usada cuando las otras no son adecuadas; puede causar hormigueo en las manos o los pies, por lo que suele acompañarse de vitamina B6.",
        "Los tratamientos más cortos se terminan con más frecuencia: en estudios reales, cerca de la mitad de las personas terminó los 9 meses de isoniazida, comparado con 7 de cada 10 con rifampina de 4 meses, y 8 de cada 10 con el plan semanal de 12 dosis.",
      ] },
    "zh-Hans": { title: "LTBI各治疗方案比较", summary: "药物名称、服药颗数、副作用，以及人们坚持完成治疗的情况。",
      simple: [
        "潜伏结核感染的治疗主要使用三种药物：异烟肼、利福喷丁和利福平。这些方案效果都不错，主要区别在于疗程长短、每次服药数量和副作用。",
        "单用利福平，每日服用4个月，是一种简单的短疗程：大多数成人通常每天服用2颗药丸。常见副作用包括轻微头痛、服药后约一小时内的胃部不适，以及体液（主要是尿液）呈橙色。",
        "异烟肼加利福喷丁，每周一次共12周，总用药次数更少，但每次剂量的药丸更多（有时一次需服7到9颗）。有些人在服药后会出现类似流感的症状。",
        "单用异烟肼6到9个月是较旧的方案，用于其他方案不适合的情况；它可能引起手脚麻木或刺痛，因此通常会同时服用维生素B6来预防。",
        "疗程越短，完成率越高：在实际研究中，约一半的人完成了9个月的异烟肼疗程，相比之下，4个月利福平疗程的完成率约为七成，而每周一次共12剂的疗程完成率约为八成。",
      ] },
    "zh-Hant": { title: "LTBI各治療方案比較", summary: "藥物名稱、服藥顆數、副作用，以及人們完成治療的情況。",
      simple: [
        "潛伏結核感染的治療主要使用三種藥物：異菸鹼醯胼、利福噴汀和利福平。這些方案效果都不錯，主要差異在於療程長短、每次服藥數量和副作用。",
        "單用利福平，每日服用4個月，是一種簡單的短療程：大多數成人通常每天服用2顆藥丸。常見副作用包括輕微頭痛、服藥後約一小時內的胃部不適，以及體液（主要是尿液）呈橙色。",
        "異菸鹼醯胼加利福噴汀，每週一次共12週，總用藥次數更少，但每次劑量的藥丸更多（有時一次需服7到9顆）。有些人服藥後會出現類似流感的症狀。",
        "單用異菸鹼醯胼6到9個月是較舊的方案，用於其他方案不適合的情況；它可能引起手腳麻木或刺痛，因此通常會同時服用維他命B6來預防。",
        "療程越短，完成率越高：在實際研究中，約一半的人完成了9個月的異菸鹼醯胼療程，相較之下，4個月利福平療程完成率約為七成，而每週一次共12劑的療程完成率約為八成。",
      ] },
    vi: { title: "So Sánh Các Liệu Trình Điều Trị LTBI", summary: "Tên thuốc, số viên phải uống, tác dụng phụ, và mức độ tuân thủ điều trị.",
      simple: [
        "Điều trị LTBI thường dùng ba loại thuốc chính: isoniazid, rifapentine, và rifampin. Tất cả đều hiệu quả; khác biệt chủ yếu là thời gian điều trị, số viên thuốc, và tác dụng phụ.",
        "Rifampin dùng một mình, hàng ngày trong 4 tháng, là lựa chọn ngắn và đơn giản: hầu hết người lớn uống khoảng 2 viên mỗi ngày. Tác dụng phụ thường gặp gồm đau đầu nhẹ, khó chịu ở dạ dày trong khoảng một giờ sau khi uống, và nước tiểu (và các dịch cơ thể khác) có màu cam.",
        "Isoniazid cộng rifapentine, uống một lần mỗi tuần trong 12 tuần, nghĩa là ít liều hơn tổng cộng, nhưng mỗi liều lại nhiều viên hơn (đôi khi 7 đến 9 viên một lúc). Một số người bị các triệu chứng giống cúm sau khi uống.",
        "Isoniazid dùng một mình trong 6 đến 9 tháng là lựa chọn cũ hơn, dùng khi các lựa chọn khác không phù hợp; nó có thể gây tê hoặc ngứa ran ở tay chân, nên thường được uống kèm vitamin B6 để phòng ngừa.",
        "Liệu trình ngắn hơn dễ hoàn thành hơn: trong các nghiên cứu thực tế, khoảng một nửa số người hoàn thành 9 tháng isoniazid, so với khoảng 7 trong 10 người với rifampin 4 tháng, và khoảng 8 trong 10 người với liệu trình 12 liều hàng tuần.",
      ] },
    ko: { title: "LTBI 치료 요법 비교", summary: "약물 이름, 복용 알약 수, 부작용, 그리고 치료를 끝까지 잘 마치는 정도.",
      simple: [
        "LTBI 치료는 주로 세 가지 약, 즉 이소니아지드, 리파펜틴, 리팜핀을 사용합니다. 모두 효과가 좋으며, 차이는 주로 치료 기간, 알약 수, 부작용에 있습니다.",
        "리팜핀 단독으로 매일 4개월간 복용하는 방법은 간단하고 짧은 옵션입니다. 대부분 성인은 하루 약 2알을 복용합니다. 흔한 부작용으로는 가벼운 두통, 복용 후 한 시간 정도의 속쓰림, 그리고 소변 등 체액이 주황색을 띠는 것이 있습니다.",
        "이소니아지드와 리파펜틴을 12주간 주 1회 복용하는 방법은 총 복용 횟수는 적지만 한 번에 먹는 알약 수가 더 많습니다(성인의 경우 한 번에 7~9알까지). 일부 사람들은 복용 후 감기 같은 증상을 겪습니다.",
        "이소니아지드 단독으로 6~9개월간 복용하는 방법은 가장 오래된 방식으로, 다른 방법이 맞지 않을 때 사용합니다. 손발 저림이나 따끔거림이 생길 수 있어 보통 비타민 B6를 함께 복용합니다.",
        "짧은 치료일수록 완료율이 높습니다. 실제 연구에서 이소니아지드 9개월 요법은 약 절반이 완료했지만, 리팜핀 4개월 요법은 약 70%, 주 1회 12회 요법은 약 80%가 완료했습니다.",
      ] },
    tl: { title: "Paghahambing ng mga Regimen sa Paggamot ng LTBI", summary: "Mga pangalan ng gamot, bilang ng tableta, side effects, at kung gaano kadalas natatapos ang paggamot.",
      simple: [
        "Ang paggamot sa LTBI ay karaniwang gumagamit ng tatlong pangunahing gamot: isoniazid, rifapentine, at rifampin. Epektibo silang lahat; ang pagkakaiba ay nasa tagal, bilang ng tableta, at side effects.",
        "Ang rifampin lamang, araw-araw sa loob ng 4 na buwan, ay isang simple at maikling opsyon: karaniwang 2 tableta bawat araw para sa karamihan ng matatanda. Kabilang sa karaniwang side effects ang banayad na sakit ng ulo, kaunting kaba ng tiyan sa loob ng isang oras pagkatapos inumin, at kulay-kahel na likido ng katawan, lalo na ang ihi.",
        "Ang isoniazid kasama ang rifapentine, isang beses kada linggo sa loob ng 12 linggo, ay nangangahulugan ng mas kaunting kabuuang dosis, pero mas maraming tableta bawat dosis (minsan 7 hanggang 9 na tableta nang sabay). Ang ilan ay nakakaranas ng sintomas na parang trangkaso pagkatapos uminom.",
        "Ang isoniazid lamang sa loob ng 6 hanggang 9 na buwan ay ang pinakalumang opsyon, ginagamit kapag hindi bagay ang iba; maaari itong magdulot ng pangingimay o pamamanhid ng kamay o paa, kaya karaniwang sinasamahan ito ng bitamina B6.",
        "Mas madaling matapos ang mas maiikling regimen: sa mga tunay na pag-aaral, halos kalahati ng mga tao ang natapos ang 9 na buwan ng isoniazid, kumpara sa halos 7 sa bawat 10 sa 4 na buwang rifampin, at halos 8 sa bawat 10 sa lingguhang 12 dosis na plano.",
      ] },
    ru: { title: "Сравнение схем лечения ЛТБИ", summary: "Названия препаратов, количество таблеток, побочные эффекты и насколько хорошо люди завершают лечение.",
      simple: [
        "Лечение ЛТБИ обычно основано на трёх препаратах: изониазид, рифапентин и рифампицин. Все они эффективны; различия в основном в длительности, числе таблеток и побочных эффектах.",
        "Рифампицин отдельно, ежедневно в течение 4 месяцев — простой короткий вариант: обычно около 2 таблеток в день для большинства взрослых. Частые побочные эффекты — лёгкая головная боль, дискомфорт в желудке в течение часа после приёма и оранжевый оттенок жидкостей тела, чаще всего мочи.",
        "Изониазид плюс рифапентин, раз в неделю в течение 12 недель, означает меньше доз всего, но больше таблеток за раз (иногда 7–9 таблеток одновременно). У некоторых людей после приёма бывают гриппоподобные симптомы.",
        "Изониазид отдельно в течение 6–9 месяцев — самый старый вариант, используемый, когда остальные не подходят; он чаще вызывает покалывание или онемение в руках и ногах, поэтому обычно назначается вместе с витамином B6.",
        "Более короткие схемы завершают чаще: в реальных исследованиях примерно половина людей закончила 9-месячный курс изониазида, по сравнению с примерно 7 из 10 на 4-месячном рифампицине и примерно 8 из 10 на еженедельной 12-дозовой схеме.",
      ] },
  },
  "treating-active": {
    es: { title: "Tratamiento de la TB activa", summary: "Varios medicamentos juntos, durante varios meses.",
      simple: [
        "La TB activa se trata con una combinación de varios medicamentos tomados juntos, normalmente durante seis meses o más.",
        "Tomar más de un medicamento a la vez ayuda a eliminar los gérmenes por completo y evita que se vuelvan resistentes a los medicamentos.",
        "Algunas personas toman su medicamento con la ayuda de un trabajador de salud que observa cada dosis, lo cual se llama terapia bajo observación directa.",
        "Terminar todo el tratamiento, incluso después de que los síntomas desaparecen, es esencial, ya que dejarlo antes de tiempo es una de las principales razones por las que la TB se vuelve más difícil de tratar.",
      ] },
    "zh-Hans": { title: "活动性结核病的治疗", summary: "多种药物联合使用，持续数月。",
      simple: [
        "活动性结核病通常需要联合使用几种药物治疗，一般持续六个月或更长时间。",
        "同时服用多种药物有助于彻底杀灭细菌，并防止产生耐药性结核病。",
        "有些患者会在医护人员的监督下服药，每次服药都有人看着，这称为“直接观察治疗”。",
        "即使症状消失，也必须完成整个疗程，因为提前停药是导致结核病变得更难治疗的主要原因之一。",
      ] },
    "zh-Hant": { title: "活動性結核病的治療", summary: "多種藥物聯合使用，持續數月。",
      simple: [
        "活動性結核病通常需要聯合使用幾種藥物治療，一般持續六個月或更長時間。",
        "同時服用多種藥物有助於徹底殺滅細菌，並防止產生抗藥性結核病。",
        "有些患者會在醫護人員的監督下服藥，每次服藥都有人看著，這稱為「直接觀察治療」。",
        "即使症狀消失，也必須完成整個療程，因為提前停藥是導致結核病變得更難治療的主要原因之一。",
      ] },
    vi: { title: "Điều Trị Bệnh Lao Hoạt Động", summary: "Nhiều loại thuốc kết hợp, dùng trong nhiều tháng.",
      simple: [
        "Lao hoạt động được điều trị bằng cách kết hợp nhiều loại thuốc lao, thường trong sáu tháng hoặc lâu hơn.",
        "Dùng nhiều thuốc cùng lúc giúp tiêu diệt vi khuẩn hoàn toàn và giúp ngăn ngừa lao kháng thuốc.",
        "Một số người uống thuốc dưới sự giám sát của nhân viên y tế, người sẽ quan sát từng liều thuốc; đây gọi là điều trị có giám sát trực tiếp.",
        "Hoàn thành toàn bộ liệu trình, ngay cả sau khi triệu chứng đã hết, là điều thiết yếu, vì ngừng thuốc sớm là một trong những nguyên nhân chính khiến lao trở nên khó điều trị hơn.",
      ] },
    ko: { title: "활동성 결핵 치료", summary: "여러 약을 함께, 여러 달 동안 복용합니다.",
      simple: [
        "활동성 결핵은 보통 여러 결핵약을 함께 사용하여 6개월 이상 치료합니다.",
        "여러 약을 동시에 복용하면 균을 완전히 제거하고 약제내성 결핵이 생기는 것을 막는 데 도움이 됩니다.",
        "일부 환자는 의료진이 매 복용을 지켜보는 '직접관찰치료' 방식으로 약을 복용합니다.",
        "증상이 사라진 후에도 전체 치료 과정을 끝내는 것이 매우 중요합니다. 조기에 중단하는 것이 결핵 치료를 더 어렵게 만드는 주요 원인이기 때문입니다.",
      ] },
    tl: { title: "Paggamot sa Active TB Disease", summary: "Maraming gamot na sabay na iniinom, sa loob ng ilang buwan.",
      simple: [
        "Ang active TB ay ginagamot gamit ang kombinasyon ng ilang gamot na sabay na iniinom, karaniwang sa loob ng anim na buwan o higit pa.",
        "Ang pag-inom ng higit sa isang gamot nang sabay ay tumutulong upang lubusang mapatay ang mikrobyo ng TB at maiwasan ang drug-resistant TB.",
        "May mga taong umiinom ng gamot na may suporta ng isang health worker na nagmamasid sa bawat dosis; tinatawag itong directly observed therapy.",
        "Mahalagang tapusin ang buong paggamot, kahit pagkawala na ng mga sintomas, dahil ang pagtigil nang maaga ay isa sa pangunahing dahilan kung bakit nagiging mas mahirap gamutin ang TB.",
      ] },
    ru: { title: "Лечение активного туберкулёза", summary: "Несколько препаратов вместе, в течение нескольких месяцев.",
      simple: [
        "Активный туберкулёз лечат комбинацией из нескольких препаратов, обычно в течение шести месяцев и более.",
        "Приём нескольких препаратов одновременно помогает полностью уничтожить микробы и предотвращает развитие лекарственно-устойчивого туберкулёза.",
        "Некоторые пациенты принимают лекарства под наблюдением медработника, который следит за каждым приёмом; это называется лечением под непосредственным наблюдением.",
        "Завершение полного курса, даже после исчезновения симптомов, крайне важно, поскольку преждевременное прекращение — одна из главных причин, по которым туберкулёз становится труднее лечить.",
      ] },
  },
  "active-tb-regimens": {
    es: { title: "Comparación de los tratamientos para la TB activa", summary: "El plan estándar de 4 medicamentos, una opción más nueva de 4 meses, y qué efectos secundarios esperar.",
      simple: [
        "La TB activa se trata normalmente con cuatro medicamentos juntos: rifampina, isoniazida, pirazinamida y etambutol, durante seis meses en total.",
        "Cada medicamento puede causar sus propios efectos secundarios: la rifampina puede volver naranja la orina y otros líquidos; la isoniazida puede causar hormigueo en manos o pies (por eso se da vitamina B6); la pirazinamida puede causar dolor en las articulaciones; el etambutol puede afectar la vista, por lo que se recomiendan revisiones oculares periódicas.",
        "Una opción más nueva, aprobada en 2022, trata a algunos pacientes en solo 4 meses usando rifapentina y moxifloxacina en lugar de rifampina y etambutol, con resultados similares para la TB que no es resistente a los medicamentos.",
        "Terminar cada dosis es fundamental, sin importar si el tratamiento dura 4 o 6 meses, ya que dejarlo antes de tiempo es una de las principales causas de que la TB se vuelva resistente a los medicamentos.",
      ] },
    "zh-Hans": { title: "活动性结核治疗方案比较", summary: "标准四联疗法、较新的4个月方案，以及应留意的副作用。",
      simple: [
        "活动性结核通常联合使用四种药物治疗：利福平、异烟肼、吡嗪酰胺和乙胺丁醇，总疗程为六个月。",
        "每种药物都有各自的副作用：利福平可能使尿液等体液变橙色；异烟肼可能引起手脚麻木或刺痛（因此会补充维生素B6）；吡嗪酰胺可能引起关节疼痛；乙胺丁醇可能影响视力，因此建议定期检查眼睛。",
        "2022年批准的新方案，使用利福喷丁和莫西沙星取代利福平和乙胺丁醇，可让部分患者在4个月内完成治疗，对非耐药结核病的效果与六个月方案相当。",
        "无论疗程是4个月还是6个月，按时完成每一剂药物都至关重要，因为提前停药是导致结核病产生耐药性的主要原因之一。",
      ] },
    "zh-Hant": { title: "活動性結核治療方案比較", summary: "標準四聯療法、較新的4個月方案，以及應留意的副作用。",
      simple: [
        "活動性結核通常聯合使用四種藥物治療：利福平、異菸鹼醯胼、吡嗪醯胺和乙胺丁醇，總療程為六個月。",
        "每種藥物都有各自的副作用：利福平可能使尿液等體液變橙色；異菸鹼醯胼可能引起手腳麻木或刺痛（因此會補充維他命B6）；吡嗪醯胺可能引起關節疼痛；乙胺丁醇可能影響視力，因此建議定期檢查眼睛。",
        "2022年核准的新方案，使用利福噴汀和莫西沙星取代利福平和乙胺丁醇，可讓部分患者在4個月內完成治療，對非抗藥性結核病的效果與六個月方案相當。",
        "無論療程是4個月還是6個月，按時完成每一劑藥物都至關重要，因為提前停藥是導致結核病產生抗藥性的主要原因之一。",
      ] },
    vi: { title: "So Sánh Các Liệu Trình Điều Trị Lao Hoạt Động", summary: "Phác đồ 4 thuốc tiêu chuẩn, lựa chọn 4 tháng mới hơn, và các tác dụng phụ cần lưu ý.",
      simple: [
        "Lao hoạt động thường được điều trị bằng bốn loại thuốc kết hợp: rifampin, isoniazid, pyrazinamide, và ethambutol, trong tổng cộng sáu tháng.",
        "Mỗi loại thuốc có tác dụng phụ riêng: rifampin có thể làm nước tiểu và các dịch khác chuyển màu cam; isoniazid có thể gây tê hoặc ngứa ran ở tay chân (nên được bổ sung vitamin B6); pyrazinamide có thể gây đau khớp; ethambutol có thể ảnh hưởng thị lực, nên cần khám mắt định kỳ.",
        "Một lựa chọn mới hơn, được phê duyệt năm 2022, điều trị một số bệnh nhân chỉ trong 4 tháng bằng cách dùng rifapentine và moxifloxacin thay cho rifampin và ethambutol, hiệu quả tương đương đối với lao không kháng thuốc.",
        "Hoàn thành mỗi liều thuốc là điều cốt yếu, dù liệu trình kéo dài 4 hay 6 tháng, vì ngừng thuốc sớm là một trong những nguyên nhân chính khiến lao trở nên kháng thuốc.",
      ] },
    ko: { title: "활동성 결핵 치료 요법 비교", summary: "표준 4제 요법, 새로운 4개월 옵션, 그리고 예상되는 부작용.",
      simple: [
        "활동성 결핵은 보통 리팜핀, 이소니아지드, 피라진아미드, 에탐부톨 네 가지 약을 함께 사용해 총 6개월간 치료합니다.",
        "각 약마다 고유한 부작용이 있습니다: 리팜핀은 소변 등 체액을 주황색으로 만들 수 있고, 이소니아지드는 손발 저림을 일으킬 수 있어 비타민 B6를 함께 복용하며, 피라진아미드는 관절통을, 에탐부톨은 시력에 영향을 줄 수 있어 정기적인 안과 검진이 권장됩니다.",
        "2022년에 승인된 새로운 옵션은 리팜핀과 에탐부톨 대신 리파펜틴과 목시플록사신을 사용해 일부 환자를 단 4개월 만에 치료하며, 내성이 없는 결핵에서는 6개월 요법과 비슷한 효과를 보입니다.",
        "치료 기간이 4개월이든 6개월이든 모든 용량을 다 복용하는 것이 중요합니다. 조기 중단은 결핵이 약제내성을 갖게 되는 주요 원인 중 하나이기 때문입니다.",
      ] },
    tl: { title: "Paghahambing ng mga Regimen sa Paggamot ng Active TB", summary: "Ang standard na 4-gamot na plano, isang mas bagong opsyon na 4 na buwan, at mga side effect na aasahan.",
      simple: [
        "Ang active TB ay karaniwang ginagamot gamit ang apat na gamot na sabay: rifampin, isoniazid, pyrazinamide, at ethambutol, sa loob ng anim na buwan sa kabuuan.",
        "Bawat gamot ay may sariling side effects: maaaring mapakahel-kahel ng rifampin ang ihi at iba pang likido; maaaring magdulot ng pangingimay ang isoniazid (kaya binibigyan ng bitamina B6); maaaring magdulot ng sakit sa kasukasuan ang pyrazinamide; at maaaring makaapekto sa paningin ang ethambutol, kaya inirerekomenda ang regular na pagsusuri sa mata.",
        "Isang mas bagong opsyon, na inaprubahan noong 2022, ay ginagamot ang ilang pasyente sa loob lamang ng 4 na buwan gamit ang rifapentine at moxifloxacin sa halip na rifampin at ethambutol, na may katulad na resulta para sa TB na hindi lumalaban sa gamot.",
        "Mahalagang tapusin ang bawat dosis, maging 4 o 6 na buwan man ang tagal ng paggamot, dahil ang pagtigil nang maaga ay isa sa pangunahing dahilan kung bakit nagiging lumalaban sa gamot ang TB.",
      ] },
    ru: { title: "Сравнение схем лечения активного туберкулёза", summary: "Стандартная схема из 4 препаратов, новый 4-месячный вариант и каких побочных эффектов ожидать.",
      simple: [
        "Активный туберкулёз обычно лечат четырьмя препаратами вместе: рифампицин, изониазид, пиразинамид и этамбутол, в течение шести месяцев в общей сложности.",
        "У каждого препарата свои побочные эффекты: рифампицин может окрасить мочу и другие жидкости в оранжевый цвет; изониазид может вызывать покалывание в руках или ногах (поэтому назначают витамин B6); пиразинамид может вызывать боль в суставах; этамбутол может влиять на зрение, поэтому рекомендуются регулярные проверки у окулиста.",
        "Новый вариант, одобренный в 2022 году, позволяет лечить некоторых пациентов всего за 4 месяца, используя рифапентин и моксифлоксацин вместо рифампицина и этамбутола, с результатами, сравнимыми с 6-месячной схемой при отсутствии лекарственной устойчивости.",
        "Завершение каждой дозы крайне важно, независимо от того, длится лечение 4 или 6 месяцев, поскольку преждевременное прекращение — одна из главных причин развития лекарственно-устойчивого туберкулёза.",
      ] },
  },
  myths: {
    es: { title: "Mitos comunes sobre la TB", summary: "Separando lo verdadero de lo que la gente suele asumir.",
      simple: [
        "Mito: la TB es una enfermedad del pasado. Realidad: la TB todavía afecta a millones de personas cada año en todo el mundo, incluso en Estados Unidos.",
        "Mito: cualquier diagnóstico de TB significa que eres contagioso. Realidad: la TB latente no se puede contagiar a nadie.",
        "Mito: puedes contagiarte de TB al dar la mano o compartir un plato. Realidad: la TB se contagia por el aire, generalmente solo después de horas de contacto cercano.",
        "Mito: un diagnóstico de TB es una sentencia de muerte. Realidad: con el tratamiento adecuado, la TB es curable para la gran mayoría de las personas.",
      ] },
    "zh-Hans": { title: "关于结核病的常见误区", summary: "分辨事实与常见的错误假设。",
      simple: [
        "误区：结核病是过去的疾病。事实：结核病如今仍在全球每年影响数百万人，包括美国。",
        "误区：任何结核病诊断都意味着具有传染性。事实：潜伏结核不会传染给任何人。",
        "误区：握手或共用餐具会感染结核病。事实：结核病通过空气传播，通常需要数小时的密切接触。",
        "误区：结核病诊断等于被判死刑。事实：只要接受适当治疗，绝大多数结核病患者都能治愈。",
      ] },
    "zh-Hant": { title: "關於結核病的常見迷思", summary: "分辨事實與常見的錯誤假設。",
      simple: [
        "迷思：結核病是過去的疾病。事實：結核病如今仍在全球每年影響數百萬人，包括美國。",
        "迷思：任何結核病診斷都代表具有傳染性。事實：潛伏結核不會傳染給任何人。",
        "迷思：握手或共用餐具會感染結核病。事實：結核病透過空氣傳播，通常需要數小時的密切接觸。",
        "迷思：結核病診斷等於被判死刑。事實：只要接受適當治療，絕大多數結核病患者都能治癒。",
      ] },
    vi: { title: "Những Quan Niệm Sai Lầm Thường Gặp về Bệnh Lao", summary: "Phân biệt sự thật với những điều người ta thường lầm tưởng.",
      simple: [
        "Lầm tưởng: Lao là bệnh của quá khứ. Sự thật: lao vẫn ảnh hưởng đến hàng triệu người mỗi năm trên toàn thế giới, kể cả ở Hoa Kỳ.",
        "Lầm tưởng: bất kỳ chẩn đoán lao nào cũng có nghĩa là bạn đang lây nhiễm. Sự thật: lao tiềm ẩn không thể lây cho bất kỳ ai.",
        "Lầm tưởng: bạn có thể bị lây lao khi bắt tay hoặc dùng chung đĩa. Sự thật: lao lây qua không khí, thường chỉ sau nhiều giờ tiếp xúc gần.",
        "Lầm tưởng: chẩn đoán lao là án tử. Sự thật: với điều trị đúng cách, lao có thể chữa khỏi cho đại đa số mọi người.",
      ] },
    ko: { title: "결핵에 대한 흔한 오해", summary: "사실과 사람들이 흔히 가정하는 것을 구분합니다.",
      simple: [
        "오해: 결핵은 과거의 질병이다. 사실: 결핵은 여전히 미국을 포함해 전 세계 수백만 명에게 매년 영향을 미치고 있습니다.",
        "오해: 결핵 진단을 받으면 무조건 전염성이 있다. 사실: 잠복결핵은 누구에게도 옮기지 않습니다.",
        "오해: 악수하거나 접시를 같이 쓰면 결핵에 걸린다. 사실: 결핵은 공기로 전염되며, 보통 몇 시간의 밀접 접촉이 있어야 옮습니다.",
        "오해: 결핵 진단은 곧 사망 선고다. 사실: 적절한 치료를 받으면 대다수의 사람들은 결핵을 완치할 수 있습니다.",
      ] },
    tl: { title: "Mga Karaniwang Maling Paniniwala Tungkol sa TB", summary: "Paghihiwalay ng totoo sa karaniwang inaakala ng mga tao.",
      simple: [
        "Maling paniniwala: ang TB ay sakit na noong unang panahon lamang. Katotohanan: apektado pa rin ng TB ang milyun-milyong tao sa buong mundo bawat taon, kabilang na ang Estados Unidos.",
        "Maling paniniwala: ang anumang diagnosis ng TB ay nangangahulugang nakakahawa ka. Katotohanan: hindi makakahawa ang latent TB sa kahit sino.",
        "Maling paniniwala: maaari kang mahawaan ng TB sa pakikipagkamay o pagbabahagi ng plato. Katotohanan: kumakalat ang TB sa hangin, karaniwan lamang pagkatapos ng ilang oras ng malapitang pakikisalamuha.",
        "Maling paniniwala: ang diagnosis ng TB ay parusang kamatayan. Katotohanan: sa tamang paggamot, nagagamot ang TB sa nakararaming tao.",
      ] },
    ru: { title: "Распространённые мифы о туберкулёзе", summary: "Отделяем правду от того, что люди обычно предполагают.",
      simple: [
        "Миф: туберкулёз — болезнь прошлого. Факт: туберкулёз до сих пор ежегодно поражает миллионы людей во всём мире, включая США.",
        "Миф: любой диагноз туберкулёза означает, что вы заразны. Факт: латентный туберкулёз не может передаваться никому.",
        "Миф: туберкулёзом можно заразиться через рукопожатие или общую тарелку. Факт: туберкулёз передаётся по воздуху, обычно только после часов близкого контакта.",
        "Миф: диагноз туберкулёза — это смертный приговор. Факт: при правильном лечении туберкулёз излечим у подавляющего большинства людей.",
      ] },
  },
  "immigration-status": {
    es: { title: "La TB, la TB latente, y tu estatus migratorio", summary: "Lo que realmente afecta un caso de inmigración, y lo que no.",
      simple: [
        "Si te preocupa que una prueba de TB pueda perjudicar una solicitud de inmigración, este es el dato más importante: solo la TB activa y contagiosa ('TB Clase A') puede hacer que alguien sea inadmisible en los Estados Unidos. La TB latente no descalifica a nadie en un examen médico de inmigración.",
        "Si un examen médico de inmigración encuentra que tienes TB latente, normalmente se te clasificará como alguien que necesita seguimiento médico, no que será rechazado. Se recomienda el tratamiento, no se usa en tu contra.",
        "Las clínicas de salud pública existen para controlar la propagación de enfermedades, no para hacer cumplir las leyes de inmigración. La información médica está protegida por leyes de privacidad. Si tienes dudas sobre la política de una clínica en particular, es razonable llamar y preguntar antes de tu visita.",
        "La 'carga pública' es una regla distinta y no relacionada sobre ciertos beneficios del gobierno, y sus detalles han cambiado varias veces en los últimos años y siguen siendo debatidos activamente en los tribunales y en nuevas regulaciones. Como esto sigue cambiando, la información general puede quedar desactualizada rápidamente; una organización de ayuda legal migratoria gratuita o de bajo costo puede darte una respuesta según la regla actual y tu situación específica.",
        "Hacerte la prueba y, si es necesario, tratarte la TB es algo que los expertos en salud pública quieren para todos, sin importar el estatus migratorio. La TB activa sin tratar es un riesgo mucho mayor para tu salud que cualquier preocupación de papeleo.",
      ] },
    "zh-Hans": { title: "结核病、潜伏结核与您的移民身份", summary: "哪些真的会影响移民案件，哪些不会。",
      simple: [
        "如果您担心结核病检测会影响移民申请，最重要的事实是：只有活动性、具有传染性的结核病（“A类结核病”）才可能使某人被视为不可入境。潜伏结核不会使任何人在移民体检中被取消资格。",
        "如果移民体检发现您有潜伏结核，通常会被归类为需要后续医疗跟进，而不是被拒绝入境。建议接受治疗，而不会因此对您不利。",
        "公共卫生诊所的职责是控制疾病传播，而不是执行移民法律。医疗信息受隐私法保护。如果您对某个诊所的具体政策不确定，可以在就诊前直接致电询问。",
        "“公共负担”是一项独立且不相关的规定，涉及某些政府福利，其细节近年来多次变化，目前仍在法庭和新法规中被积极讨论。由于这项规定一直在变化，通用信息可能很快过时；免费或低成本的移民法律援助机构可以根据当前规定和您的具体情况给出解答。",
        "无论移民身份如何，接受检测并在需要时接受治疗，都是公共卫生专家希望每个人都做到的事。未经治疗的活动性结核病对健康的威胁，远大于任何文件方面的顾虑。",
      ] },
    "zh-Hant": { title: "結核病、潛伏結核與您的移民身分", summary: "哪些真的會影響移民案件，哪些不會。",
      simple: [
        "如果您擔心結核病檢測會影響移民申請，最重要的事實是：只有活動性、具傳染性的結核病（「A類結核病」）才可能使某人被視為不可入境。潛伏結核不會使任何人在移民體檢中被取消資格。",
        "如果移民體檢發現您有潛伏結核，通常會被歸類為需要後續醫療追蹤，而非被拒絕入境。建議接受治療，並不會因此對您不利。",
        "公共衛生診所的職責是控制疾病傳播，而非執行移民法律。醫療資訊受隱私法保護。如果您對某診所的具體政策不確定，可以在就診前直接致電詢問。",
        "「公共負擔」是一項獨立且不相關的規定，涉及某些政府福利，其細節近年多次變化，目前仍在法庭和新法規中被積極討論。由於此規定持續變動，一般資訊可能很快過時；免費或低成本的移民法律援助機構可依目前規定與您的具體情況提供解答。",
        "無論移民身分為何，接受檢測並在需要時接受治療，都是公共衛生專家希望每個人都做到的事。未經治療的活動性結核病對健康的威脅，遠大於任何文件方面的顧慮。",
      ] },
    vi: { title: "Bệnh Lao, Lao Tiềm Ẩn, và Tình Trạng Di Trú Của Bạn", summary: "Điều gì thực sự ảnh hưởng đến hồ sơ di trú — và điều gì không.",
      simple: [
        "Nếu bạn lo rằng xét nghiệm lao có thể ảnh hưởng đến đơn xin di trú, đây là điều quan trọng nhất: chỉ có lao đang hoạt động và lây nhiễm ('Lao Loại A') mới có thể khiến ai đó bị coi là không đủ điều kiện nhập cảnh vào Hoa Kỳ. Lao tiềm ẩn không khiến ai bị loại khỏi khám sức khỏe di trú.",
        "Nếu khám sức khỏe di trú phát hiện bạn mắc lao tiềm ẩn, bạn thường sẽ được xếp vào diện cần theo dõi y tế thêm, chứ không bị từ chối. Việc điều trị được khuyến nghị, không bị dùng để chống lại bạn.",
        "Các phòng khám y tế công cộng tồn tại để kiểm soát sự lây lan của bệnh, không phải để thực thi luật di trú. Thông tin y tế được bảo vệ bởi luật riêng tư. Nếu bạn không chắc về chính sách của một phòng khám cụ thể, bạn có thể gọi điện hỏi trước khi đến khám.",
        "'Gánh nặng công cộng' là một quy định riêng biệt, không liên quan, về việc sử dụng một số phúc lợi của chính phủ, và các chi tiết của nó đã thay đổi nhiều lần trong những năm gần đây và vẫn đang được tranh luận tích cực tại tòa án và trong các quy định mới. Vì điều này vẫn đang thay đổi, thông tin chung có thể nhanh chóng lỗi thời — một tổ chức hỗ trợ pháp lý di trú miễn phí hoặc chi phí thấp có thể cho bạn câu trả lời dựa trên quy định hiện hành và hoàn cảnh cụ thể của bạn.",
        "Việc xét nghiệm và, nếu cần, điều trị lao là điều mà các chuyên gia y tế công cộng mong muốn cho tất cả mọi người, bất kể tình trạng di trú. Lao hoạt động không được điều trị là rủi ro lớn hơn nhiều cho sức khỏe của bạn so với bất kỳ lo ngại nào về giấy tờ.",
      ] },
    ko: { title: "결핵, 잠복결핵, 그리고 이민 신분", summary: "실제로 이민 사건에 영향을 미치는 것과 그렇지 않은 것.",
      simple: [
        "결핵 검사가 이민 신청에 해를 끼칠까 걱정된다면, 가장 중요한 사실은 이것입니다: 활동성이고 전염성이 있는 결핵('A등급 결핵')만이 미국 입국 부적격 사유가 될 수 있습니다. 잠복결핵은 이민 건강검진에서 누구도 실격시키지 않습니다.",
        "이민 건강검진에서 잠복결핵이 발견되면, 보통 추가 의료 관찰이 필요한 것으로 분류될 뿐 입국이 거부되지 않습니다. 치료가 권장될 뿐, 불이익으로 이어지지 않습니다.",
        "공공보건 클리닉의 목적은 질병 확산을 막는 것이지 이민법을 집행하는 것이 아닙니다. 의료 정보는 개인정보 보호법으로 보호됩니다. 특정 클리닉의 방침이 궁금하다면 방문 전에 직접 전화해 물어보는 것도 합리적입니다.",
        "'공적부담(Public Charge)'은 특정 정부 혜택에 관한 별개의 규정으로, 최근 몇 년간 여러 차례 바뀌었고 현재도 법원과 새로운 규정에서 활발히 논의되고 있습니다. 계속 바뀌고 있기 때문에 일반적인 정보는 금방 낡은 것이 될 수 있습니다 — 무료 또는 저비용 이민 법률 지원 단체가 현재 규정과 당신의 구체적인 상황에 맞는 답을 줄 수 있습니다.",
        "이민 신분과 관계없이 검사를 받고 필요하다면 치료를 받는 것은 공공보건 전문가들이 모든 사람에게 바라는 일입니다. 치료받지 않은 활동성 결핵은 서류 문제보다 건강에 훨씬 더 큰 위험입니다.",
      ] },
    tl: { title: "TB, Latent TB, at ang Iyong Immigration Status", summary: "Ano ang talagang nakaaapekto sa isang immigration case — at kung ano ang hindi.",
      simple: [
        "Kung nag-aalala ka na ang pagsusuri sa TB ay maaaring makasama sa isang aplikasyon sa imigrasyon, ito ang pinakamahalagang katotohanan: tanging ang active at nakakahawang TB ('Class A TB') lamang ang maaaring maging dahilan upang ituring na 'inadmissible' ang isang tao sa Estados Unidos. Hindi diskwalipika ang latent TB sa isang medical exam para sa imigrasyon.",
        "Kung natuklasan sa medical exam na may latent TB ka, karaniwan kang ikakategorya bilang isang nangangailangan ng follow-up na medikal na pangangalaga, hindi tatanggihan. Inirerekomenda ang paggamot, hindi ito gagamitin laban sa iyo.",
        "Ang mga klinika ng pampublikong kalusugan ay umiiral upang pigilan ang paglaganap ng sakit, hindi upang ipatupad ang batas sa imigrasyon. Protektado ng batas sa privacy ang impormasyong medikal. Kung hindi ka sigurado sa patakaran ng isang partikular na klinika, makatuwiran na tumawag at magtanong bago ang iyong pagbisita.",
        "Ang 'public charge' ay hiwalay at walang kaugnayang panuntunan tungkol sa ilang benepisyo ng gobyerno, at ang mga detalye nito ay nagbago nang ilang beses sa mga nakaraang taon at aktibong pinagdedebatehan pa rin sa korte at sa mga bagong regulasyon. Dahil patuloy itong nagbabago, maaaring maluma agad ang pangkalahatang impormasyon — isang libre o murang organisasyon ng tulong legal para sa imigrasyon ang makakapagbigay sa iyo ng sagot base sa kasalukuyang patakaran at sa iyong sariling sitwasyon.",

/* ---------------------------------- glossary rendering ---------------------------------- */

function GlossaryWord({ term, definition, sizeClass }) {
  const [open, setOpen] = useState(false);
  return (
    <span>
      <button
        onClick={(e) => {
          e.stopPropagation();
          setOpen((o) => !o);
        }}
        className={`font-semibold underline decoration-2 underline-offset-4 ${sizeClass}`}
        style={{ color: "var(--accent)", textDecorationStyle: "dotted", textDecorationColor: "var(--highlight)" }}
        aria-expanded={open}
      >
        {term}
      </button>
      {open && (
        <span
          className={`block mt-2 mb-1 pl-3 border-l-2 ${sizeClass}`}
          style={{ borderColor: "var(--highlight)", color: "var(--ink-soft)" }}
        >
          {definition}
        </span>
      )}
    </span>
  );
}

function renderRichText(text, sizeClass) {
  const regex = /\[\[(.+?)\|\|(.+?)\]\]/g;
  const parts = [];
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parts.push(<span key={key++}>{text.slice(lastIndex, match.index)}</span>);
    }
    parts.push(<GlossaryWord key={key++} term={match[1]} definition={match[2]} sizeClass={sizeClass} />);
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) {
    parts.push(<span key={key++}>{text.slice(lastIndex)}</span>);
  }
  return parts;
}

function plainText(paragraphs) {
  return paragraphs.map((p) => p.replace(/\[\[(.+?)\|\|(.+?)\]\]/g, "$1")).join(" ");
}

function timeAgo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr${hrs === 1 ? "" : "s"} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days === 1 ? "" : "s"} ago`;
}

function useFonts() {
  useEffect(() => {
    const id = "tb-honest-research-fonts";
    if (document.getElementById(id)) return;
    const link = document.createElement("link");
    link.id = id;
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap";
    document.head.appendChild(link);
  }, []);
}

// Font stacks fall back through Noto Sans variants so Chinese, Korean, Vietnamese,
// and Cyrillic (Russian) all render with real glyphs instead of tofu boxes, while
// Atkinson Hyperlegible (chosen for its readability focus) still leads for
// Latin-script languages.

const HEADLINE_FONT_STACK =

const LIST_TITLE_SIZES = ["text-lg", "text-xl", "text-2xl"];
const INTRO_SIZES = ["text-xl", "text-2xl", "text-3xl"];

function TBHonestResearchApp() {
  useFonts();

  const [tab, setTab] = useState("library"); // 'library' | 'research'
  const [view, setView] = useState("home"); // 'home' | 'article'

  const [category, setCategory] = useState("All");
  const [level, setLevel] = useState("simple");
  const [sizeStep, setSizeStep] = useState(1);
  const [speaking, setSpeaking] = useState(false);
  const [lang, setLang] = useState("en");
  const [langMenuOpen, setLangMenuOpen] = useState(false);
  const [langLoaded, setLangLoaded] = useState(false);

  const strings = UI_STRINGS[lang] || UI_STRINGS.en;

  // load saved language preference once on mount
  useEffect(() => {
    try {
      const saved = localStorage.getItem("lang-pref");
      if (saved && UI_STRINGS[saved]) setLang(saved);
    } catch (e) {
      // no saved preference yet — default to English
    }
    setLangLoaded(true);
  }, []);

  function changeLang(code) {
    setLang(code);
    setLangMenuOpen(false);
    try {
      localStorage.setItem("lang-pref", code);
    } catch (e) {
      // ignore — persistence is best-effort
    }
  }

  // Resolves the right title/summary/category label for the current language,
  // falling back to English when a translation doesn't exist yet.
  function localizedArticle(article) {
    const tr = ARTICLE_TRANSLATIONS[article.id]?.[lang];
    return {
      title: tr?.title || article.title,
      summary: tr?.summary || article.summary,
      hasSimpleTranslation: Boolean(tr?.simple),
    };
  }

  function localizedCategory(cat) {
    return strings.categories[cat] || cat;
  }

  // Body paragraphs for the article reading view: translated "Simple" content when
  // available, otherwise English for both levels (with a note shown separately).
  function localizedBody(article) {
    const tr = ARTICLE_TRANSLATIONS[article.id]?.[lang];
    if (lang !== "en" && level === "simple" && tr?.simple) {
      return { paragraphs: tr.simple, isFallbackEnglish: false };
    }
    return { paragraphs: article[level], isFallbackEnglish: lang !== "en" };
  }

  const [expandedResearchId, setExpandedResearchId] = useState(null);
  const [activeJourneyStage, setActiveJourneyStage] = useState(JOURNEY_STAGES[0].id);
  const [journeySubSelections, setJourneySubSelections] = useState({});

  // supports current items ("summary") as well as older cached items
  // that used separate simple/detailed summaries
  function researchSummaryFor(item) {
    return item.summary || item.summarySimple || item.summaryDetailed || [];
  }

  const bodySize = BODY_SIZES[sizeStep];
  const titleSize = TITLE_SIZES[sizeStep];
  const listTitleSize = LIST_TITLE_SIZES[sizeStep];
  const introSize = INTRO_SIZES[sizeStep];

  const activeArticle = useMemo(() => ARTICLES.find((a) => a.id === activeId) || null, [activeId]);

  // Strips [[term||definition]] markup down to "term definition" so both the
  // glossary term itself and its plain-language definition are searchable.
  function unwrapGlossary(text) {
    return text.replace(/\[\[(.+?)\|\|(.+?)\]\]/g, "$1 $2");
  }

  function searchableText(article) {
    const tr = ARTICLE_TRANSLATIONS[article.id]?.[lang];
    const parts = [
      article.title,
      article.summary,
      tr?.title,
      tr?.summary,
      ...(article.simple || []),
      ...(article.detailed || []),
      ...(tr?.simple || []),
      ...(article.sources || []).map((s) => s.label),
    ].filter(Boolean);
    return unwrapGlossary(parts.join(" \n ")).toLowerCase();
  }

  function matchSnippet(article, q) {
    if (!q) return null;
    const loc = localizedArticle(article);
    const alreadyVisible =
      loc.title.toLowerCase().includes(q) || loc.summary.toLowerCase().includes(q);
    if (alreadyVisible) return null;
    const body = unwrapGlossary(
      [...(article.simple || []), ...(article.detailed || [])].join(" \n ")
    );
    const idx = body.toLowerCase().indexOf(q);
    if (idx === -1) return null;
    const start = Math.max(0, idx - 40);
    const end = Math.min(body.length, idx + q.length + 60);
    return (start > 0 ? "…" : "") + body.slice(start, end).trim() + (end < body.length ? "…" : "");
  }

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return ARTICLES.filter((a) => {
      const matchesCategory = category === "All" || a.category === category;
      const matchesQuery = !q || searchableText(a).includes(q);
      return matchesCategory && matchesQuery;
    });
  }, [query, category, lang]);

  function openArticle(id) {
    stopSpeaking();
    setActiveId(id);
    setLevel("simple");
    setView("article");
  }

    stopSpeaking();
    setView("home");
    setActiveId(null);
  }

    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    setSpeaking(false);
  }

    en: "en-US", es: "es-ES", ru: "ru-RU", vi: "vi-VN", ko: "ko-KR",

  };

  function toggleSpeak() {
    if (!activeArticle) return;
    if (speaking) {
      stopSpeaking();
      return;
    }
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const title = localizedArticle(activeArticle).title;
    const body = localizedBody(activeArticle);
    const text = `${title}. ${plainText(body.paragraphs)}`;
    const utter = new window.SpeechSynthesisUtterance(text);
    utter.rate = 0.95;
    utter.lang = SPEECH_LANG_MAP[lang] || "en-US";
    utter.onend = () => setSpeaking(false);
    utter.onerror = () => setSpeaking(false);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    setSpeaking(true);
  }

  useEffect(() => stopSpeaking, []);

  return (
    <div
      style={{
        "--bg": "#F5F1E6",
        "--bg-alt": "#ECE6D4",
        "--ink": "#1C2B2A",
        "--ink-soft": "#4B5B58",
        "--accent": "#2B6E68",
        "--accent-soft": "#DCEAE7",
        "--highlight": "#B8791F",
        "--line": "#D9D2BE",
        backgroundColor: "var(--bg)",
        color: "var(--ink)",
        fontFamily: BODY_FONT_STACK,
        minHeight: "100%",
      }}
      className="w-full"
    >
      <div className="max-w-2xl mx-auto px-5 pb-16">
        {/* top bar */}
        <div className="sticky top-0 z-10 flex items-center justify-between py-4" style={{ backgroundColor: "var(--bg)" }}>
          {view === "article" ? (
            <button onClick={goHome} className="flex items-center gap-1 font-semibold" style={{ color: "var(--accent)" }}>
              <ChevronLeft size={20} />
              <span>Back</span>
            </button>
          ) : (
            <span className="font-semibold" style={{ fontFamily: HEADLINE_FONT_STACK, fontSize: "1.3rem", fontWeight: 600 }}>
              TB Honest
            </span>
          )}

          <div className="flex items-center gap-2 relative">
            {view === "article" && (
              <button
                onClick={toggleSpeak}
                aria-pressed={speaking}
                className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-semibold border"
                style={{
                  borderColor: speaking ? "var(--accent)" : "var(--line)",
                  color: speaking ? "white" : "var(--ink)",
                  backgroundColor: speaking ? "var(--accent)" : "transparent",
                }}
              >
                {speaking ? <VolumeX size={16} /> : <Volume2 size={16} />}
                {speaking ? strings.stop : strings.listen}
              </button>
            )}
            <button
              onClick={() => setSizeStep((s) => (s + 1) % 3)}
              className="flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold border"
              style={{ borderColor: "var(--line)" }}
              aria-label="Change text size"
              title="Change text size"
            >
              <Type size={16} />
              {["S", "M", "L"][sizeStep]}
            </button>
            <button
              onClick={() => setLangMenuOpen((o) => !o)}
              className="flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold border"
              style={{ borderColor: "var(--line)" }}
