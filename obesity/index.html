        onClick={(e) => {
          e.stopPropagation();
          setOpen((o) => !o);
        }}
        className={`font-semibold underline decoration-2 underline-offset-4 ${sizeClass}`}
        style={{ color: "var(--accent)", textDecorationStyle: "dotted", textDecorationColor: "var(--highlight)" }}
        aria-expanded={open}
      >
        {term}
      </button>
      {open && (
        <span
          className={`block mt-2 mb-1 pl-3 border-l-2 ${sizeClass}`}
          style={{ borderColor: "var(--highlight)", color: "var(--ink-soft)" }}
        >
          {definition}
        </span>
      )}
    </span>
  );
}

function renderRichText(text, sizeClass) {
  const regex = /\[\[(.+?)\|\|(.+?)\]\]/g;
  const parts = [];
  let lastIndex = 0;
  let match;
  let key = 0;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parts.push(<span key={key++}>{text.slice(lastIndex, match.index)}</span>);
    }
    parts.push(<GlossaryWord key={key++} term={match[1]} definition={match[2]} sizeClass={sizeClass} />);
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) {
    parts.push(<span key={key++}>{text.slice(lastIndex)}</span>);
  }
  return parts;
}

/* ---------------------------------- fonts ---------------------------------- */

function useFonts() {
  useEffect(() => {
    const id = "obesity-honest-fonts";
    if (document.getElementById(id)) return;
    const link = document.createElement("link");
    link.id = id;
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap";
    document.head.appendChild(link);
  }, []);
}

const BODY_FONT_STACK = "'Atkinson Hyperlegible', sans-serif";
const HEADLINE_FONT_STACK = "'Fraunces', serif";

/* ---------------------------------- app ---------------------------------- */

const BODY_SIZES = ["text-base", "text-lg", "text-xl"];
const TITLE_SIZES = ["text-2xl", "text-3xl", "text-4xl"];
const LIST_TITLE_SIZES = ["text-lg", "text-xl", "text-2xl"];
const INTRO_SIZES = ["text-xl", "text-2xl", "text-3xl"];

function ObesityHonestApp() {
  useFonts();

  const [tab, setTab] = useState("library"); // 'library' | 'research' | 'stigma'
  const [view, setView] = useState("home"); // 'home' | 'article'
  const [activeId, setActiveId] = useState(null);
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const [level, setLevel] = useState("simple");
  const [sizeStep, setSizeStep] = useState(1);
  const [speaking, setSpeaking] = useState(false);
  const [stigmaLevel, setStigmaLevel] = useState("simple");

  const bodySize = BODY_SIZES[sizeStep];
  const titleSize = TITLE_SIZES[sizeStep];
  const listTitleSize = LIST_TITLE_SIZES[sizeStep];
  const introSize = INTRO_SIZES[sizeStep];

  const activeArticle = useMemo(() => ARTICLES.find((a) => a.id === activeId) || null, [activeId]);

  function unwrapGlossary(text) {
    return text.replace(/\[\[(.+?)\|\|(.+?)\]\]/g, "$1 $2");
  }

  function searchableText(article) {
    const parts = [
      article.title,
      article.summary,
      ...(article.simple || []),
      ...(article.detailed || []),
      ...(article.sources || []).map((s) => s.label),
    ].filter(Boolean);
    return unwrapGlossary(parts.join(" \n ")).toLowerCase();
  }

  function matchSnippet(article, q) {
    if (!q) return null;
    const alreadyVisible = article.title.toLowerCase().includes(q) || article.summary.toLowerCase().includes(q);
    if (alreadyVisible) return null;
    const body = unwrapGlossary([...(article.simple || []), ...(article.detailed || [])].join(" \n "));
    const idx = body.toLowerCase().indexOf(q);
    if (idx === -1) return null;
    const start = Math.max(0, idx - 40);
    const end = Math.min(body.length, idx + q.length + 60);
    return (start > 0 ? "…" : "") + body.slice(start, end).trim() + (end < body.length ? "…" : "");
  }

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return ARTICLES.filter((a) => {
      const matchesCategory = category === "All" || a.category === category;
      const matchesQuery = !q || searchableText(a).includes(q);
      return matchesCategory && matchesQuery;
    });
  }, [query, category]);

  function openArticle(id) {
    stopSpeaking();
    setActiveId(id);
    setLevel("simple");
    setView("article");
  }

  function goHome() {
    stopSpeaking();
    setView("home");
    setActiveId(null);
  }

  function stopSpeaking() {
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    setSpeaking(false);
  }

  function toggleSpeak() {
    if (!activeArticle) return;
    if (speaking) {
      stopSpeaking();
      return;
    }
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const plain = (activeArticle[level] || []).map((p) => p.replace(/\[\[(.+?)\|\|(.+?)\]\]/g, "$1")).join(" ");
    const text = `${activeArticle.title}. ${plain}`;
    const utter = new window.SpeechSynthesisUtterance(text);
    utter.rate = 0.95;
    utter.onend = () => setSpeaking(false);
    utter.onerror = () => setSpeaking(false);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    setSpeaking(true);
  }

  useEffect(() => stopSpeaking, []);

  return (
    <div
      style={{
        "--bg": "#F4F3EC",
        "--bg-alt": "#E8E4D6",
        "--ink": "#29332B",
        "--ink-soft": "#647062",
        "--accent": "#4C7A5E",
        "--accent-soft": "#DCE8DD",
        "--highlight": "#C1633D",
        "--line": "#DED8C8",
        backgroundColor: "var(--bg)",
        color: "var(--ink)",
        fontFamily: BODY_FONT_STACK,
        minHeight: "100%",
      }}
      className="w-full"
    >
      <div className="max-w-2xl mx-auto px-5 pb-16">
        {/* top bar */}
        <div className="sticky top-0 z-10 flex items-center justify-between py-4" style={{ backgroundColor: "var(--bg)" }}>
          {view === "article" ? (
            <button onClick={goHome} className="flex items-center gap-1 font-semibold" style={{ color: "var(--accent)" }}>
              <ChevronLeft size={20} />
              <span>Back</span>
            </button>
          ) : (
            <span className="font-semibold" style={{ fontFamily: HEADLINE_FONT_STACK, fontSize: "1.3rem", fontWeight: 600 }}>
              Obesity Honest
            </span>
          )}

          <div className="flex items-center gap-2">
            {view === "article" && (
              <button
                onClick={toggleSpeak}
                aria-pressed={speaking}
                className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-semibold border"
                style={{
                  borderColor: speaking ? "var(--accent)" : "var(--line)",
                  color: speaking ? "white" : "var(--ink)",
                  backgroundColor: speaking ? "var(--accent)" : "transparent",
                }}
              >
                {speaking ? <VolumeX size={16} /> : <Volume2 size={16} />}
                {speaking ? "Stop" : "Listen"}
              </button>
            )}
            <button
              onClick={() => setSizeStep((s) => (s + 1) % 3)}
              className="flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold border"
              style={{ borderColor: "var(--line)" }}
              aria-label="Change text size"
              title="Change text size"
            >
              <Type size={16} />
              {["S", "M", "L"][sizeStep]}
            </button>
          </div>
        </div>

        {/* mission hero */}
        {view === "home" && (
          <div className="mb-8 pb-8" style={{ borderBottom: "1px solid var(--line)" }}>
            <h1 className={titleSize} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600, lineHeight: 1.15 }}>
              Understanding obesity shouldn't require a medical degree.
            </h1>
            <p className={`${bodySize} mt-3`} style={{ color: "var(--ink-soft)", maxWidth: "42rem" }}>
              Obesity Honest turns real, sourced research into plain language you can actually use — including
              the facts that cut through stigma, and why obesity is now recognized as a chronic disease, not a
              personal failing.
            </p>
          </div>
        )}

        {/* top-level tabs */}
        {view === "home" && (
          <div className="flex flex-wrap gap-2 mb-6">
            {[
              ["research", "New Research"],
              ["library", "Library"],
              ["stigma", "Stigma"],
            ].map(([key, label]) => (
              <button
                key={key}
                onClick={() => setTab(key)}
                className={`rounded-full px-4 py-1.5 font-semibold border ${bodySize}`}
                style={{
                  borderColor: tab === key ? "var(--highlight)" : "var(--line)",
                  backgroundColor: tab === key ? "var(--accent-soft)" : "transparent",
                  color: tab === key ? "var(--ink)" : "var(--ink-soft)",
                }}
              >
                {label}
              </button>
            ))}
          </div>
        )}

        {/* ---------------- library / home ---------------- */}
        {view === "home" && tab === "library" && (
          <>
            <p className={`${introSize} leading-snug mb-6`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 500 }}>
              Browse articles on causes, diagnosis, and treatment — written in plain language and backed by
              real sources.
            </p>

            <div className="flex items-center gap-2 rounded-full px-4 py-2.5 mb-4" style={{ backgroundColor: "var(--bg-alt)" }}>
              <Search size={18} style={{ color: "var(--ink-soft)" }} />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search topics, like 'GLP-1' or 'BMI'"
                className={`bg-transparent outline-none w-full ${bodySize}`}
                style={{ color: "var(--ink)" }}
              />
              {query && (
                <button onClick={() => setQuery("")} aria-label="Clear search">
                  <X size={16} style={{ color: "var(--ink-soft)" }} />
                </button>
              )}
            </div>

            <div className="flex gap-2 overflow-x-auto pb-1 mb-6" style={{ scrollbarWidth: "none" }}>
              {CATEGORIES.map((c) => {
                const activeCat = c === category;
                return (
                  <button
                    key={c}
                    onClick={() => setCategory(c)}
                    className={`shrink-0 rounded-full px-4 py-1.5 border font-semibold ${bodySize}`}
                    style={{
                      borderColor: activeCat ? "var(--highlight)" : "var(--line)",
                      backgroundColor: activeCat ? "var(--accent-soft)" : "transparent",
                      color: activeCat ? "var(--ink)" : "var(--ink-soft)",
                    }}
                  >
                    {c}
                  </button>
                );
              })}
            </div>

            {filtered.length === 0 ? (
              <p className={`${bodySize} py-8`} style={{ color: "var(--ink-soft)" }}>
                No articles match your search. Try a different word or category.
              </p>
            ) : (
              <div>
                {filtered.map((a, i) => {
                  const snippet = matchSnippet(a, query.trim().toLowerCase());
                  return (
                    <button
                      key={a.id}
                      onClick={() => openArticle(a.id)}
                      className="w-full text-left py-5"
                      style={{ borderTop: i === 0 ? "1px solid var(--line)" : "none", borderBottom: "1px solid var(--line)" }}
                    >
                      <div className={listTitleSize} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
                        {a.title}
                      </div>
                      <div className={`${bodySize} mt-1`} style={{ color: "var(--ink-soft)" }}>
                        {a.summary}
                      </div>
                      {snippet && (
                        <div className="text-sm mt-1.5 italic" style={{ color: "var(--ink-soft)" }}>
                          "{snippet}"
                        </div>
                      )}
                      <div className="text-sm mt-2" style={{ color: "var(--highlight)" }}>
                        {a.category} · {a.readTime}
                      </div>
                    </button>
                  );
                })}
              </div>
            )}

            <p className="text-sm mt-8" style={{ color: "var(--ink-soft)" }}>
              This app explains general health information in plain language. It is not medical advice and
              doesn't replace a visit with your doctor or nurse.
            </p>
          </>
        )}

        {/* ---------------- new research (placeholder) ---------------- */}
        {view === "home" && tab === "research" && (
          <>
            <p className={`${introSize} leading-snug mb-2`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 500 }}>
              Real obesity research, explained simply.
            </p>
            <p className={`${bodySize} mb-8`} style={{ color: "var(--ink-soft)" }}>
              This section isn't built yet.
            </p>
            <div className="rounded-xl py-10 text-center" style={{ backgroundColor: "var(--bg-alt)" }}>
              <div className={`${listTitleSize} font-semibold`} style={{ fontFamily: HEADLINE_FONT_STACK }}>
                Under construction
              </div>
              <p className={`${bodySize} mt-2`} style={{ color: "var(--ink-soft)" }}>
                Check the Library and Stigma tabs in the meantime.
              </p>
            </div>
          </>
        )}

        {/* ---------------- stigma ---------------- */}
        {view === "home" && tab === "stigma" && (
          <>
            <p className={`${introSize} leading-snug mb-6`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 500 }}>
              {STIGMA_CONTENT.title}
            </p>

            <div className="inline-flex rounded-full p-1 mb-6" style={{ backgroundColor: "var(--bg-alt)" }} role="tablist" aria-label="Reading level">
              {[
                ["simple", "Simple"],
                ["detailed", "More detail"],
              ].map(([key, label]) => (
                <button
                  key={key}
                  role="tab"
                  aria-selected={stigmaLevel === key}
                  onClick={() => setStigmaLevel(key)}
                  className={`rounded-full px-4 py-1.5 font-semibold ${bodySize}`}
                  style={{ backgroundColor: stigmaLevel === key ? "var(--accent)" : "transparent", color: stigmaLevel === key ? "white" : "var(--ink-soft)" }}
                >
                  {label}
                </button>
              ))}
            </div>

            <div className={`${bodySize} space-y-4`} style={{ lineHeight: 1.7 }}>
              {STIGMA_CONTENT[stigmaLevel].map((p, idx) => (
                <p key={idx}>{renderRichText(p, bodySize)}</p>
              ))}
            </div>

            <div className="mt-10 pt-6" style={{ borderTop: "1px solid var(--line)" }}>
              <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink-soft)" }}>
                Sources
              </div>
              <ul className="space-y-1">
                {STIGMA_CONTENT.sources.map((s, idx) => (
                  <li key={idx}>
                    <a
                      href={s.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-sm inline-flex items-center gap-1"
                      style={{ color: "var(--accent)" }}
                    >
                      {s.label}
                      <ExternalLink size={12} />
                    </a>
                  </li>
                ))}
              </ul>
            </div>

            <p className="text-sm mt-6" style={{ color: "var(--ink-soft)" }}>
              This is general health information, not medical advice. Please talk with your doctor or nurse
              about your own health and treatment.
            </p>
          </>
        )}

        {/* ---------------- article ---------------- */}
        {view === "article" && activeArticle && (
          <div>
            <div className="text-sm font-semibold mb-2" style={{ color: "var(--highlight)" }}>
              {activeArticle.category} · {activeArticle.readTime}
            </div>
            <h1 className={`${titleSize} mb-4 leading-tight`} style={{ fontFamily: HEADLINE_FONT_STACK, fontWeight: 600 }}>
              {activeArticle.title}
            </h1>

            <div className="inline-flex rounded-full p-1 mb-6" style={{ backgroundColor: "var(--bg-alt)" }} role="tablist" aria-label="Reading level">
              {[
                ["simple", "Simple"],
                ["detailed", "More detail"],
              ].map(([key, label]) => (
                <button
                  key={key}
                  role="tab"
                  aria-selected={level === key}
                  onClick={() => setLevel(key)}
                  className={`rounded-full px-4 py-1.5 font-semibold ${bodySize}`}
                  style={{ backgroundColor: level === key ? "var(--accent)" : "transparent", color: level === key ? "white" : "var(--ink-soft)" }}
                >
                  {label}
                </button>
              ))}
            </div>

            <div className={`${bodySize} space-y-4`} style={{ lineHeight: 1.7 }}>
              {activeArticle[level].map((p, idx) => (
                <p key={idx}>{renderRichText(p, bodySize)}</p>
              ))}
            </div>

            {activeArticle.sources && activeArticle.sources.length > 0 && (
              <div className="mt-10 pt-6" style={{ borderTop: "1px solid var(--line)" }}>
                <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink-soft)" }}>
                  Sources
                </div>
                <ul className="space-y-1">
                  {activeArticle.sources.map((s, idx) => (
                    <li key={idx}>
                      <a
                        href={s.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-sm inline-flex items-center gap-1"
                        style={{ color: "var(--accent)" }}
                      >
                        {s.label}
                        <ExternalLink size={12} />
                      </a>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <p className="text-sm mt-6 pt-6" style={{ color: "var(--ink-soft)", borderTop: activeArticle.sources ? "none" : "1px solid var(--line)" }}>
              This is general health information, not medical advice. Please talk with your doctor or nurse
              about your own health and treatment.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ObesityHonestApp />);

</script>

  var sourceCode = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(sourceCode, {
    presets: [["react", { runtime: "classic" }]]
  }).code;
  var scriptEl = document.createElement("script");
  scriptEl.text = compiled;
  document.body.appendChild(scriptEl);
</script>
